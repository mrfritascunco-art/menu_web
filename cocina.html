<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Fritas | Cocina</title>
<style>
:root{--y:#ffc400;--k:#111;--g:#f2f1ed;--red:#b42318;--green:#16794b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#111}header{background:#111;color:#fff;text-align:center;padding:20px 16px;border-bottom:5px solid var(--y)}header img{width:min(220px,65vw)}header b{display:block;margin-top:7px;font-size:18px}main{max-width:720px;margin:auto;padding:16px}.box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001;margin-bottom:16px}.field{width:100%;padding:14px;border:1px solid #ccc;border-radius:11px;margin:6px 0;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;background:var(--y)}.logout{background:#111;color:#fff;margin-top:12px}.hidden{display:none}.msg{font-size:13px;color:#666;margin-top:9px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.top h2{margin:0}.count{background:var(--y);padding:7px 10px;border-radius:999px;font-weight:900}.order{border:2px solid #ddd;border-radius:16px;padding:15px;margin:12px 0;background:#fff}.order.nuevo{border-color:var(--y)}.order h3{margin:0 0 6px;font-size:22px}.meta{font-weight:800;margin-bottom:10px}.packing{font-size:16px;font-weight:1000;padding:12px;border-radius:10px;margin:9px 0;border:2px solid #111}.packing-delivery{background:#dcecff;border-color:#1769aa}.packing-retiro{background:#fff1b8;border-color:#e2a800}.packing-local{background:#dff7e7;border-color:#16834f}.items{background:#f7f7f7;border-radius:11px;padding:10px;margin:9px 0}.item{padding:4px 0}.item-detail{margin:5px 0 5px 14px;padding:5px 8px;background:#fff;border-left:3px solid #bbb;border-radius:5px;font-size:14px;font-weight:800;overflow-wrap:anywhere}.item-detail.added{border-left-color:#16834f}.item-detail.removed{border-left-color:#b42318;color:#9a211a}.payment-method{font-size:16px;font-weight:900;padding:10px 12px;border-radius:10px;margin:9px 0;background:#eef2ff;border:2px solid #334155}.payment-method.cash{background:#e7f8ed;border-color:#16834f}.payment-method.transfer{background:#e5efff;border-color:#1769aa}.note{padding:9px;background:#fff3cd;border-radius:9px;margin-top:8px}.total{font-size:20px;font-weight:1000;margin-top:10px}.status{display:inline-block;border-radius:999px;padding:7px 10px;font-weight:900;font-size:13px;background:#eee}.status.nuevo{background:#fff1b8}.status.preparando{background:#ffe1c2}.status.listo{background:#dff7e7;color:#12652e}.status.en_reparto{background:#dcecff;color:#174f8a}.action{margin-top:12px;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:1000;cursor:pointer}.prepare{background:#ff8a00;color:#111}.ready{background:#16834f;color:#fff}.delivery{background:#1769aa;color:#fff}.delivered{background:#111;color:#fff}.empty{text-align:center;padding:30px 10px;color:#666;font-weight:800}
</style></head><body>
<header><img src="logo.png.png" alt="Mr. Fritas"><b>🔥 PANEL DE COCINA</b></header>
<main><section class="box" id="loginBox"><h2>🔐 Ingresar a cocina</h2><input class="field" id="email" type="email" placeholder="Correo"><input class="field" id="password" type="password" placeholder="Contraseña"><button class="btn" id="loginBtn" type="button">Entrar</button><div class="msg" id="loginMsg"></div></section>
<section class="box hidden" id="kitchenBox"><div class="top"><h2>Pedidos</h2><span class="count" id="orderCount">0</span></div><div id="orders"><div class="empty">Cargando pedidos…</div></div><button class="btn logout" id="logoutBtn" type="button">Cerrar sesión</button><div class="msg" id="statusMsg"></div></section></main>
<script src="gestion-sesion.js"></script><script>
const SUPABASE_URL="https://oiybkvtamrhjfcyfayes.supabase.co";const SUPABASE_KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";let token="",knownNewOrders=null,audioCtx=null;const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function money(n){return "$"+Number(n||0).toLocaleString("es-CL")}
async function api(path,opt={}){const headers={apikey:SUPABASE_KEY,"Content-Type":"application/json",...(opt.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(SUPABASE_URL+path,{...opt,headers});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function showKitchen(){$("loginBox").classList.add("hidden");$("kitchenBox").classList.remove("hidden")}function showLogin(){$("kitchenBox").classList.add("hidden");$("loginBox").classList.remove("hidden")}
function enableAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function ding(){try{enableAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type="sine";o.frequency.setValueAtTime(880,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.35,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.35);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.36)}catch(e){}}
function newOrderAlert(){ding();setTimeout(ding,550);setTimeout(ding,1100)}
async function login(){enableAudio();const m=$("loginMsg");m.textContent="Ingresando…";try{const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});token=r.access_token;const allowed=await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"cocina"})});const admin=allowed===true?true:await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"admin"})});if(admin!==true){token="";throw Error("Esta cuenta no tiene permiso de cocina.")}sessionStorage.setItem("mf_kitchen_token",token);showKitchen();await loadOrders()}catch(e){m.textContent=e.message==="Esta cuenta no tiene permiso de cocina."?e.message:"No se pudo ingresar. Revisa correo, contraseña o permisos."}}
function logout(){sessionStorage.removeItem("mf_kitchen_token");MFSession.clear();token="";knownNewOrders=null;showLogin()}
function itemText(item){const qty=item.quantity??item.qty??1;const name=item.name??item.nombre??"Producto";const details=Array.isArray(item.details)?item.details:Array.isArray(item.mods)?item.mods:[];const lines=details.map(d=>{let value=String(d),removed=/^Sin\s/i.test(value),added=/^\+\s*/.test(value);return '<div class="item-detail '+(removed?'removed':added?'added':'')+'">'+(removed?'🚫 ':added?'➕ ':'• ')+esc(value)+'</div>'}).join("");return '<div class="item"><b>'+esc(qty)+'×</b> '+esc(name)+lines+'</div>'}
function actionButton(r){if(r.status==="nuevo")return '<button class="action prepare" data-order="'+r.id+'" data-status="preparando">🔥 COMENZAR PREPARACIÓN</button>';if(r.status==="preparando")return '<button class="action ready" data-order="'+r.id+'" data-status="listo">✅ MARCAR COMO LISTO</button>';if(r.status==="listo"){if(String(r.order_type).toLowerCase().includes("delivery"))return '<button class="action delivery" data-order="'+r.id+'" data-status="en_reparto">🛵 MARCAR EN REPARTO</button>';return '<button class="action delivered" data-order="'+r.id+'" data-status="entregado">🤝 MARCAR ENTREGADO</button>'}if(r.status==="en_reparto")return '<button class="action delivered" data-order="'+r.id+'" data-status="entregado">🤝 FINALIZAR PEDIDO</button>';return ''}
function renderOrders(rows){$("orderCount").textContent=rows.length;if(!rows.length){$("orders").innerHTML='<div class="empty">No hay pedidos pendientes 👌</div>';return}$("orders").innerHTML=rows.map(r=>{const items=Array.isArray(r.items)?r.items:[];const time=new Date(r.created_at).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});return '<article class="order '+esc(r.status)+'"><h3>Pedido #'+esc(r.order_number)+'</h3><div class="meta">'+esc(time)+'</div><div class="packing packing-'+(String(r.order_type||"").toLowerCase().includes("delivery")?"delivery":String(r.order_type||"").toLowerCase().includes("retiro")?"retiro":"local")+'">'+(String(r.order_type||"").toLowerCase().includes("delivery")?"🛵 DELIVERY — EMPACAR PARA ENVÍO":String(r.order_type||"").toLowerCase().includes("retiro")?"🛍️ RETIRO — EMPACAR PARA LLEVAR":"🍽️ SERVIR EN LOCAL — "+(r.table_number?"MESA "+esc(r.table_number):"SIN EMPAQUE PARA LLEVAR"))+'</div><span class="status '+esc(r.status)+'">'+esc(String(r.status).toUpperCase())+'</span><div class="items">'+items.map(itemText).join("")+'</div>'+(r.payment_method?'<div class="payment-method '+(/efectivo/i.test(String(r.payment_method))?'cash':/transferencia/i.test(String(r.payment_method))?'transfer':'')+'">'+(/efectivo/i.test(String(r.payment_method))?'💵 ':/transferencia/i.test(String(r.payment_method))?'🏦 ':'💳 ')+'PAGO: '+esc(String(r.payment_method).toUpperCase())+'</div>':'<div class="payment-method">💳 PAGO: NO INFORMADO</div>')+(r.notes?'<div class="note">📝 '+esc(r.notes)+'</div>':'')+'<div class="total">Total '+money(r.total)+'</div>'+actionButton(r)+'</article>'}).join("")}
async function loadOrders(){const m=$("statusMsg");m.textContent="Actualizando…";try{const rows=await api("/rest/v1/orders?select=*&status=in.(nuevo,preparando,listo,en_reparto)&order=created_at.desc");const currentNew=new Set(rows.filter(r=>r.status==="nuevo").map(r=>String(r.id)));if(knownNewOrders!==null&&[...currentNew].some(id=>!knownNewOrders.has(id)))newOrderAlert();knownNewOrders=currentNew;renderOrders(rows);m.textContent="✅ Pedidos actualizados"}catch(e){$("orders").innerHTML='<div class="empty">No se pudieron cargar los pedidos.</div>';m.textContent="❌ Error al cargar"}}
async function setStatus(id,status){const m=$("statusMsg");m.textContent="Guardando estado…";try{await api("/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:status,updated_at:new Date().toISOString()})});m.textContent="✅ Estado actualizado";await loadOrders()}catch(e){m.textContent="❌ No se pudo cambiar el estado"}}
$("loginBtn").addEventListener("click",login);$("logoutBtn").addEventListener("click",logout);$("orders").addEventListener("click",function(e){enableAudio();const b=e.target.closest("[data-order]");if(b)setStatus(b.dataset.order,b.dataset.status)});document.addEventListener("click",enableAudio,{once:true});
setInterval(()=>{if(token)loadOrders()},5000);
(async()=>{try{token=await MFSession.get("cocina")||sessionStorage.getItem("mf_kitchen_token")||""}catch(e){token=sessionStorage.getItem("mf_kitchen_token")||""}if(token){try{const allowed=await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"cocina"})});if(allowed!==true){const admin=await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"admin"})});if(admin!==true)throw Error("Sin permiso")}showKitchen();await loadOrders()}catch(e){logout()}}})();
</script></body></html>
