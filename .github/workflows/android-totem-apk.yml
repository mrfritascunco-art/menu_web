name: Compilar APK Tótem Mr Fritas
on:
  push:
    paths:
      - 'android-totem/**'
      - '.github/workflows/android-totem-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-totem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK disponible
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MrFritas-Totem-APK-prueba
          path: android-totem/app/build/outputs/apk/debug/app-debug.apk
