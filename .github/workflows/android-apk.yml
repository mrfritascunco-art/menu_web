name: Generar APK Mr Fritas
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Instalar ícono personalizado
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("../icon-512.png").convert("RGBA")
          base = Path("android/app/src/main/res")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              target = base / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(target/"ic_launcher.png")
              icon.save(target/"ic_launcher_round.png")
              icon.save(target/"ic_launcher_foreground.png")
          adaptive = base/"mipmap-anydpi-v26"
          adaptive.mkdir(parents=True,exist_ok=True)
          for name in ("ic_launcher.xml","ic_launcher_round.xml"):
              (adaptive/name).write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')
          PY
      - name: Compilar APK de prueba
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Fritas-Gestion-APK-prueba
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
