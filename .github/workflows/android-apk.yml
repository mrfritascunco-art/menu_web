name: Generar APK Mr Fritas
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Compilar APK de prueba
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Fritas-Gestion-APK-prueba
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
