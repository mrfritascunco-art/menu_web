<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr Fritas · Configuración TV</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f3f1e9;color:#111;margin:0}header{background:#111;color:#ffc400;text-align:center;padding:24px}main{max-width:650px;margin:20px auto;padding:0 14px}.box{background:white;padding:22px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 15px #0001}label{display:block;font-weight:bold;margin:16px 0 6px}input[type=number],textarea{width:100%;font:inherit;border:1px solid #aaa;border-radius:9px;padding:12px}textarea{min-height:76px}input[type=checkbox]{width:23px;height:23px;vertical-align:middle;margin-right:9px}button,.link{display:block;text-align:center;background:#ffc400;color:#111;border:0;border-radius:10px;padding:14px;font:800 16px Arial;text-decoration:none;width:100%;cursor:pointer;margin:10px 0}.hidden{display:none}.msg{color:#555;font-size:14px}a{color:inherit}</style></head><body><header><h1>📺 Configuración de TV</h1><p>MR FRITAS · GESTIÓN</p></header><main><div class="box" id="auth">Comprobando acceso de administrador…</div><div class="box hidden" id="settings"><p class="msg">Los cambios se guardan para la TV del local. La pantalla consulta los ajustes automáticamente cada minuto.</p><label>Segundos por hamburguesa o promoción</label><input id="slide_seconds" type="number" min="4" max="60"><label><input id="voice_enabled" type="checkbox"> Anunciar pedidos listos con voz</label><label><input id="show_promotions" type="checkbox"> Mostrar promociones en la rotación</label><label><input id="show_customer_names" type="checkbox"> Mostrar y anunciar el nombre del cliente cuando corresponda</label><label>Frase para pedidos para llevar</label><textarea id="ready_takeaway_text" maxlength="180"></textarea><label>Frase para retiro en mesón</label><textarea id="ready_counter_text" maxlength="180"></textarea><button id="save">💾 Guardar cambios</button><p class="msg" id="msg"></p><a class="link" target="_blank" rel="noopener" href="tv.html">📺 Vista previa de la TV</a><a class="link" href="gestion.html" style="background:#ddd">← Volver a Gestión</a></div></main><script src="gestion-sesion.js"></script><script>const BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";let token="";const $=id=>document.getElementById(id);async function api(path,options={}){const r=await fetch(BASE+"/rest/v1/"+path,{...options,headers:{"apikey":KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json",...(options.headers||{})}});if(!r.ok)throw Error("Error "+r.status+": "+await r.text());return r.status===204?null:r.json()}async function init(){try{token=await MFSession.get("admin");if(!token)throw Error("Debes entrar a Gestión con una cuenta de Administración.");const rows=await api("tv_settings?select=*&id=eq.1");if(!rows[0])throw Error("No se encontraron ajustes de TV");for(const [k,v] of Object.entries(rows[0])){const el=$(k);if(el){if(el.type==="checkbox")el.checked=!!v;else el.value=v}}$("auth").classList.add("hidden");$("settings").classList.remove("hidden")}catch(e){$("auth").textContent=e.message+" ";const a=document.createElement("a");a.href="gestion.html";a.textContent="Ir a Gestión";$("auth").append(a)}}$("save").onclick=async()=>{const msg=$("msg");msg.textContent="Guardando…";const data={slide_seconds:Number($("slide_seconds").value),voice_enabled:$("voice_enabled").checked,show_promotions:$("show_promotions").checked,show_customer_names:$("show_customer_names").checked,ready_takeaway_text:$("ready_takeaway_text").value.trim(),ready_counter_text:$("ready_counter_text").value.trim()};if(data.slide_seconds<4||data.slide_seconds>60||!data.ready_takeaway_text||!data.ready_counter_text){msg.textContent="Revisa los segundos (4–60) y las frases.";return}try{await api("tv_settings?id=eq.1",{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify(data)});msg.textContent="✅ Cambios guardados. La TV los aplicará automáticamente."}catch(e){msg.textContent="❌ "+e.message}};init();</script></body></html>
