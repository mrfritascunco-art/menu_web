<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Fritas | Admin</title>
<style>
:root{--y:#ffc400;--k:#111;--g:#f2f1ed}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#111}header{background:#111;color:#fff;text-align:center;padding:24px 16px;border-bottom:5px solid var(--y)}header img{width:min(260px,72vw)}main{max-width:720px;margin:auto;padding:18px}.box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001;margin-bottom:16px}h1,h2{margin-top:0}.field{width:100%;padding:13px;border:1px solid #ccc;border-radius:11px;margin:6px 0;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:900;font-size:15px;cursor:pointer;background:var(--y)}.logout{background:#111;color:#fff;margin-top:8px}.product{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.product:last-child{border:0}.name{font-weight:900}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.toggle{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;cursor:pointer}.toggle.on.featured{background:#fff1b8;border-color:#ffc400}.toggle.off.available{background:#ffe1e1;border-color:#e88;color:#8b1717}.toggle.on.available{background:#dff7e7;border-color:#9dba9d;color:#12652e}.msg{font-size:13px;color:#666;margin-top:9px}.hidden{display:none}
</style></head><body>
<header><img src="logo.png.png" alt="Mr. Fritas"><div style="font-weight:1000;margin-top:8px">PANEL ADMINISTRADOR</div></header>
<main>
<div class="box" id="loginBox"><h2>🔐 Ingresar</h2><input class="field" id="email" type="email" placeholder="Correo administrador"><input class="field" id="password" type="password" placeholder="Contraseña"><button class="btn" onclick="login()">Entrar</button><div class="msg" id="loginMsg"></div></div>
<div class="box hidden" id="adminBox"><h2>🍔 Control del menú</h2><p style="color:#666">Marca productos como <b>Más pedidos</b> o <b>Agotados</b>. Los cambios se guardan al instante.</p><div id="products">Cargando…</div><button class="btn logout" onclick="logout()">Cerrar sesión</button><div class="msg" id="saveMsg"></div></div>
</main>
<script>
const SUPABASE_URL="https://oiybkvtamrhjfcyfayes.supabase.co";
const SUPABASE_KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
let token="",rows=[];
async function api(path,opt={}){let h={"apikey":SUPABASE_KEY,"Content-Type":"application/json",...(opt.headers||{})};if(token)h.Authorization="Bearer "+token;let r=await fetch(SUPABASE_URL+path,{...opt,headers:h});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function login(){let m=document.getElementById("loginMsg");m.textContent="Ingresando…";try{let r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email.value.trim(),password:password.value})});token=r.access_token;sessionStorage.setItem("mf_admin_token",token);showAdmin();await loadProducts()}catch(e){m.textContent="No se pudo ingresar. Revisa correo y contraseña."}}
function logout(){sessionStorage.removeItem("mf_admin_token");token="";adminBox.classList.add("hidden");loginBox.classList.remove("hidden")}
function showAdmin(){loginBox.classList.add("hidden");adminBox.classList.remove("hidden")}
async function loadProducts(){try{rows=await api("/rest/v1/menu_control?select=*&order=product_id");renderProducts()}catch(e){products.textContent="No se pudieron cargar los productos.";saveMsg.textContent=e.message}}
function renderProducts(){products.innerHTML=rows.map(r=>'<div class="product"><div><div class="name">'+r.product_name+'</div><small>'+r.product_id+'</small></div><div class="controls"><button class="toggle featured '+(r.featured?'on':'')+'" onclick="setState(\''+r.product_id+'\',\'featured\','+(!r.featured)+')">🔥 '+(r.featured?'Más pedido':'Destacar')+'</button><button class="toggle available '+(r.available?'on':'off')+'" onclick="setState(\''+r.product_id+'\',\'available\','+(!r.available)+')">'+(r.available?'🟢 Disponible':'🔴 Agotado')+'</button></div></div>').join("")}
async function setState(id,field,value){saveMsg.textContent="Guardando…";try{await api("/rest/v1/menu_control?product_id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({[field]:value,updated_at:new Date().toISOString()})});let r=rows.find(x=>x.product_id===id);r[field]=value;renderProducts();saveMsg.textContent="✅ Cambio guardado"}catch(e){saveMsg.textContent="❌ No se pudo guardar el cambio"}}
(async()=>{token=sessionStorage.getItem("mf_admin_token")||"";if(token){showAdmin();await loadProducts()}})();
</script></body></html>
