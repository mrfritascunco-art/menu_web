<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Fritas | Admin</title>
<style>
:root{--y:#ffc400;--k:#111;--g:#f2f1ed}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#111}header{background:#111;color:#fff;text-align:center;padding:24px 16px;border-bottom:5px solid var(--y)}header img{width:min(260px,72vw)}main{max-width:720px;margin:auto;padding:18px}.box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001;margin-bottom:16px}h1,h2{margin-top:0}.field{width:100%;padding:13px;border:1px solid #ccc;border-radius:11px;margin:6px 0;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:900;font-size:15px;cursor:pointer;background:var(--y)}.logout{background:#111;color:#fff;margin-top:8px}.product{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.product:last-child{border:0}.name{font-weight:900}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.toggle{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;cursor:pointer}.toggle.on.featured{background:#fff1b8;border-color:#ffc400}.toggle.off.available{background:#ffe1e1;border-color:#e88;color:#8b1717}.toggle.on.available{background:#dff7e7;border-color:#9dba9d;color:#12652e}.msg{font-size:13px;color:#666;margin-top:9px}.hidden{display:none}.save-all{margin-top:16px;background:#111;color:#fff}.save-all.dirty{background:var(--y);color:#111}.tabs{display:flex;gap:7px;margin:14px 0}.tab{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 6px;font-weight:900;cursor:pointer}.tab.active{background:var(--y);border-color:var(--y)}.price-edit{width:90px;padding:8px;border:1px solid #ccc;border-radius:9px;font-weight:800}
</style></head><body>
<header><img src="logo.png.png" alt="Mr. Fritas"><div style="font-weight:1000;margin-top:8px">PANEL ADMINISTRADOR</div></header>
<main>
<div class="box" id="loginBox"><h2>🔐 Ingresar</h2><input class="field" id="email" type="email" placeholder="Correo administrador"><input class="field" id="password" type="password" placeholder="Contraseña"><button class="btn" onclick="login()">Entrar</button><div class="msg" id="loginMsg"></div></div>
<div class="box hidden" id="adminBox"><h2>⚙️ Control del menú</h2><div class="tabs"><button type="button" class="tab active" id="tabProducts" data-tab="products">🍔 Productos</button><button type="button" class="tab" id="tabExtras" data-tab="extras">➕ Extras</button><button type="button" class="tab" id="tabPapas" data-tab="papas">🍟 Papas</button><button type="button" class="tab" id="tabSauces" data-tab="sauces">🥫 Salsas</button></div><p id="tabHelp" style="color:#666">Marca productos como <b>Más pedidos</b> o <b>Agotados</b>.</p><div id="products">Cargando…</div><div id="extras" class="hidden"></div><div id="papas" class="hidden"></div><div id="sauces" class="hidden"></div><button class="btn save-all" id="saveAllBtn" onclick="savePrices()">💾 Guardar cambios de precios</button><button class="btn logout" onclick="logout()">Cerrar sesión</button><div class="msg" id="saveMsg"></div></div>
</main>
<script>
const SUPABASE_URL="https://oiybkvtamrhjfcyfayes.supabase.co";
const SUPABASE_KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
let token="",rows=[],extraRows=[],papasRows=[],sauceRows=[],pendingPrices={products:{},extras:{},papas:{}};
async function api(path,opt={}){let h={"apikey":SUPABASE_KEY,"Content-Type":"application/json",...(opt.headers||{})};if(token)h.Authorization="Bearer "+token;let r=await fetch(SUPABASE_URL+path,{...opt,headers:h});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function login(){let m=document.getElementById("loginMsg");m.textContent="Ingresando…";try{let r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});token=r.access_token;sessionStorage.setItem("mf_admin_token",token);showAdmin();await loadAll()}catch(e){m.textContent="No se pudo ingresar. Revisa correo y contraseña."}}
function logout(){sessionStorage.removeItem("mf_admin_token");token="";adminBox.classList.add("hidden");loginBox.classList.remove("hidden")}
function showAdmin(){loginBox.classList.add("hidden");adminBox.classList.remove("hidden")}
async function loadProducts(){try{rows=await api("/rest/v1/menu_control?select=*&order=product_id");renderProducts()}catch(e){products.textContent="No se pudieron cargar los productos.";saveMsg.textContent=e.message}}
async function loadAll(){await loadProducts();try{extraRows=await api("/rest/v1/menu_extras?select=*&order=name");papasRows=await api("/rest/v1/menu_papas_extras?select=*&order=name");sauceRows=await api("/rest/v1/menu_sauces?select=*&order=name");renderExtras();renderPapas();renderSauces()}catch(e){saveMsg.textContent="No se pudieron cargar extras, papas o salsas."}}
function showTab(which){["products","extras","papas","sauces"].forEach(function(x){var el=document.getElementById(x);if(el)el.classList.toggle("hidden",x!==which)});var tp=document.getElementById("tabProducts"),te=document.getElementById("tabExtras"),tpa=document.getElementById("tabPapas"),ts=document.getElementById("tabSauces"),help=document.getElementById("tabHelp");if(tp)tp.classList.toggle("active",which==="products");if(te)te.classList.toggle("active",which==="extras");if(tpa)tpa.classList.toggle("active",which==="papas");if(ts)ts.classList.toggle("active",which==="sauces");if(help)help.innerHTML=which==="products"?"Marca productos como <b>Más pedidos</b> o <b>Agotados</b>.":which==="extras"?"Cambia el <b>precio</b> y la <b>disponibilidad</b> de los extras de hamburguesas.":which==="papas"?"Cambia el <b>precio</b> y la <b>disponibilidad</b> de los toppings de papas.":"Marca las <b>salsas disponibles o agotadas</b>."}
function renderExtras(){extras.innerHTML=extraRows.map(r=>'<div class="product"><div><div class="name">'+r.name+'</div><small>Precio $ <input class="price-edit" type="number" min="0" step="100" value="'+r.price+'" oninput="queuePrice('extras',r.id,this.value)"></small></div><div class="controls"><button class="toggle available '+(r.available?'on':'off')+'" onclick="setExtraAvailable(\''+r.id+'\','+(!r.available)+')">'+(r.available?'🟢 Disponible':'🔴 Agotado')+'</button></div></div>').join("")}
function renderPapas(){papas.innerHTML=papasRows.map(r=>'<div class="product"><div><div class="name">'+r.name+'</div><small>Precio $ <input class="price-edit" type="number" min="0" step="100" value="'+r.price+'" oninput="queuePrice('papas',r.id,this.value)"></small></div><div class="controls"><button class="toggle available '+(r.available?'on':'off')+'" onclick="setPapasAvailable(\''+r.id+'\','+(!r.available)+')">'+(r.available?'🟢 Disponible':'🔴 Agotado')+'</button></div></div>').join("")}
function renderSauces(){sauces.innerHTML=sauceRows.map(r=>'<div class="product"><div class="name">'+r.name+'</div><div class="controls"><button class="toggle available '+(r.available?'on':'off')+'" onclick="setSauceAvailable(\''+r.id+'\','+(!r.available)+')">'+(r.available?'🟢 Disponible':'🔴 Agotado')+'</button></div></div>').join("")}
async function patchTable(table,id,data){saveMsg.textContent="Guardando…";try{await api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({...data,updated_at:new Date().toISOString()})});saveMsg.textContent="✅ Cambio guardado";return true}catch(e){saveMsg.textContent="❌ No se pudo guardar el cambio";return false}}
async function setExtraAvailable(id,value){if(await patchTable("menu_extras",id,{available:value})){let r=extraRows.find(x=>x.id===id);r.available=value;renderExtras()}}
async function setPapasAvailable(id,value){if(await patchTable("menu_papas_extras",id,{available:value})){let r=papasRows.find(x=>x.id===id);r.available=value;renderPapas()}}
async function setSauceAvailable(id,value){if(await patchTable("menu_sauces",id,{available:value})){let r=sauceRows.find(x=>x.id===id);r.available=value;renderSauces()}}
function renderProducts(){products.innerHTML=rows.map(r=>'<div class="product"><div><div class="name">'+r.product_name+'</div><small>Precio $ <input class="price-edit" type="number" min="0" step="100" value="'+(r.price??0)+'" oninput="queuePrice('products',r.product_id,this.value)"> • '+r.product_id+'</small></div><div class="controls"><button class="toggle featured '+(r.featured?'on':'')+'" onclick="setState(\''+r.product_id+'\',\'featured\','+(!r.featured)+')">🔥 '+(r.featured?'Más pedido':'Destacar')+'</button><button class="toggle available '+(r.available?'on':'off')+'" onclick="setState(\''+r.product_id+'\',\'available\','+(!r.available)+')">'+(r.available?'🟢 Disponible':'🔴 Agotado')+'</button></div></div>').join("")}
async function setState(id,field,value){saveMsg.textContent="Guardando…";try{await api("/rest/v1/menu_control?product_id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({[field]:value,updated_at:new Date().toISOString()})});let r=rows.find(x=>x.product_id===id);r[field]=value;renderProducts();saveMsg.textContent="✅ Cambio guardado"}catch(e){saveMsg.textContent="❌ No se pudo guardar el cambio"}}
async function setProductPrice(id,value){value=Math.max(0,parseInt(value||"0",10));saveMsg.textContent="Guardando precio…";try{await api("/rest/v1/menu_control?product_id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({price:value,updated_at:new Date().toISOString()})});let r=rows.find(x=>x.product_id===id);r.price=value;saveMsg.textContent="✅ Precio actualizado"}catch(e){saveMsg.textContent="❌ No se pudo guardar el precio"}}
function queuePrice(group,id,value){pendingPrices[group][id]=Math.max(0,parseInt(value||"0",10));let b=document.getElementById("saveAllBtn");if(b){b.classList.add("dirty");b.textContent="💾 Guardar cambios"}}
async function savePrices(){let jobs=[];Object.entries(pendingPrices.products).forEach(([id,price])=>jobs.push(api("/rest/v1/menu_control?product_id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({price,updated_at:new Date().toISOString()})})));Object.entries(pendingPrices.extras).forEach(([id,price])=>jobs.push(api("/rest/v1/menu_extras?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({price,updated_at:new Date().toISOString()})})));Object.entries(pendingPrices.papas).forEach(([id,price])=>jobs.push(api("/rest/v1/menu_papas_extras?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({price,updated_at:new Date().toISOString()})})));if(!jobs.length){saveMsg.textContent="No hay cambios de precios pendientes.";return}saveMsg.textContent="Guardando cambios…";try{await Promise.all(jobs);Object.entries(pendingPrices.products).forEach(([id,price])=>{let r=rows.find(x=>x.product_id===id);if(r)r.price=price});Object.entries(pendingPrices.extras).forEach(([id,price])=>{let r=extraRows.find(x=>x.id===id);if(r)r.price=price});Object.entries(pendingPrices.papas).forEach(([id,price])=>{let r=papasRows.find(x=>x.id===id);if(r)r.price=price});pendingPrices={products:{},extras:{},papas:{}};let b=document.getElementById("saveAllBtn");b.classList.remove("dirty");b.textContent="💾 Guardar cambios de precios";saveMsg.textContent="✅ Cambios guardados correctamente"}catch(e){saveMsg.textContent="❌ No se pudieron guardar todos los cambios"}}
document.querySelectorAll("[data-tab]").forEach(function(btn){btn.addEventListener("click",function(){showTab(btn.dataset.tab)})});
(async()=>{token=sessionStorage.getItem("mf_admin_token")||"";if(token){showAdmin();await loadAll()}})();
</script></body></html>
