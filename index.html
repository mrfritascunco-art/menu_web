<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Fritas | Menú</title>
<style>
:root{--y:#fbbd08;--k:#111;--w:#fff;--g:#f5f5f3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#171717;padding-bottom:92px}
header{background:#111;color:#fff;padding:22px 16px 18px;text-align:center;border-bottom:6px solid var(--y)}
header h1{margin:0;font-size:34px;letter-spacing:-1px}header h1 span{color:var(--y)}header p{margin:6px 0 0;color:#ddd}
nav{display:flex;gap:8px;overflow:auto;padding:12px;position:sticky;top:0;background:#fff;z-index:4;box-shadow:0 2px 8px #0001}
nav button{white-space:nowrap;border:0;border-radius:20px;background:#eee;padding:10px 14px;font-weight:800}nav button.active{background:var(--y)}
main{max-width:820px;margin:auto;padding:12px}.section{margin:12px 0 28px}.section h2{font-size:25px;margin:8px 2px 12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 14px #00000012;display:flex;flex-direction:column}
.pic{height:115px;background:linear-gradient(135deg,#ffd338,#f5a900);display:grid;place-items:center;font-size:54px}.info{padding:12px;display:flex;flex-direction:column;flex:1}.info h3{margin:0 0 6px;font-size:18px;text-transform:uppercase}.desc{font-size:13px;color:#555;line-height:1.35;flex:1}.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.price{font-weight:900;font-size:19px}.add{border:0;background:#111;color:#fff;width:38px;height:38px;border-radius:50%;font-size:25px}
.note{background:#111;color:#fff;border-radius:14px;padding:16px}.note b{color:var(--y)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:12px 14px;z-index:8}.barin{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.cartbtn{background:var(--y);border:0;border-radius:12px;padding:13px 17px;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:820px;margin:auto}.sheet h2{margin-top:0}
.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding:10px 0}.qty button{border:0;border-radius:7px;width:29px;height:29px}.total{font-size:23px;font-weight:900;text-align:right;margin:16px 0}
.field{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px 0 10px;font-size:16px}.types{display:flex;gap:8px}.types label{flex:1;background:#eee;border-radius:10px;padding:11px;text-align:center;font-weight:700}
.whatsapp{width:100%;background:#25d366;color:#fff;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:900}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.pic{height:145px}}
</style>
</head>
<body>
<header><h1>MR. <span>FRITAS</span></h1><p>Smash burgers & papitas • Cunco</p></header>
<nav id="nav"></nav><main id="menu"></main>
<div class="bar"><div class="barin"><div><b id="count">0 productos</b><br><span id="mini">$0</span></div><button class="cartbtn" onclick="openCart()">Ver pedido 🛒</button></div></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>Tu pedido</h2><div id="items"></div><div class="total">Total: <span id="total">$0</span></div>
<div class="types"><label><input type="radio" name="tipo" value="Retiro en local" checked> Retiro</label><label><input type="radio" name="tipo" value="Delivery"> Delivery</label></div>
<input class="field" id="name" placeholder="Tu nombre"><input class="field" id="address" placeholder="Dirección (si es delivery)"><textarea class="field" id="obs" placeholder="Observaciones"></textarea>
<button class="whatsapp" onclick="sendWA()">Enviar pedido por WhatsApp</button></div></div>
<script>
const sections=[
{name:"Smash Burgers",items:[
["Smash Peanut",8990,"Carne smash, queso cheddar, tocino, mantequilla de maní • Incluye papitas"],
["Cheese Burger",4990,"Carne smash, pepinillos, mayo casera"],
["Mr ¼ de Kilo",13500,"3 carnes smash (255 g), triple cheddar, doble tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas"],
["Oklahoma Burger",7490,"Carne smash estilo Oklahoma con cebolla, pepinillo, queso mantecoso, mostaza • Incluye papitas"],
["Cuarto de Libra",5990,"Carne smash 120 g, doble cheddar, cebolla, ketchup-mostaza, pepinillo"],
["Smash Whopper",5990,"Carne smash, lechuga, cebolla, tomate, mayo casera"]]},
{name:"Arma tu Smash",items:[["Base Smash",5500,"Pan brioche, carne smash y mayo casera • Incluye papas fritas"],["Carne smash extra",2000,"Agregado"],["Tocino crispy",1500,"Agregado"],["Queso cheddar",1000,"Agregado"],["Queso mantecoso",1000,"Agregado"],["Champiñones",1000,"Agregado"],["Cebolla caramelizada",800,"Agregado"],["Cebolla morada",800,"Agregado"],["Pepinillos",800,"Agregado"]]},
{name:"Papas & Toppings",items:[["Papas fritas base",3000,"Papas fritas naturales • tamaño base"],["Papas fritas grande",5000,"Papas fritas naturales • tamaño grande"],["Carne mechada",2000,"Topping"],["Pollo",2000,"Topping"],["Tocino crispy",2500,"Topping"],["Salchichas",1500,"Topping"],["Queso fundido",1500,"Topping"],["Queso cheddar",1500,"Topping"],["Cebolla caramelizada",1000,"Topping"],["Pimentón",1000,"Topping"],["Champiñón",1000,"Topping"],["Choclo",1000,"Topping"],["Salsa premium",500,"Mayo casera, mayo ajo, mayo cilantro, salsa de queso, choclo o tocino"]]},
{name:"Promos",items:[["Combo para 2",17900,"2 smash clásicas + papas + salsas + 2 bebidas • Exclusivo consumo local"]]}
];
let cart={}; const fmt=n=>"$"+n.toLocaleString("es-CL");
function render(){const nav=document.getElementById("nav"),m=document.getElementById("menu");nav.innerHTML="";m.innerHTML="";
sections.forEach((s,si)=>{let b=document.createElement("button");b.textContent=s.name;b.onclick=()=>document.getElementById("s"+si).scrollIntoView({behavior:"smooth"});if(!si)b.className="active";nav.appendChild(b);
let sec=document.createElement("section");sec.className="section";sec.id="s"+si;sec.innerHTML="<h2>"+s.name+"</h2><div class='grid'></div>";let g=sec.querySelector(".grid");
s.items.forEach((p,pi)=>{let id=si+"-"+pi,d=document.createElement("div");d.className="card";d.innerHTML="<div class='pic'>"+(si===2?"🍟":"🍔")+"</div><div class='info'><h3>"+p[0]+"</h3><div class='desc'>"+p[2]+"</div><div class='row'><span class='price'>"+fmt(p[1])+"</span><button class='add' onclick=\"add('"+id+"')\">+</button></div></div>";g.appendChild(d)});m.appendChild(sec)})}
function product(id){let [a,b]=id.split("-").map(Number);return sections[a].items[b]}function add(id){cart[id]=(cart[id]||0)+1;update()}
function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];drawCart();update()}
function update(){let c=0,t=0;Object.entries(cart).forEach(([id,q])=>{c+=q;t+=product(id)[1]*q});document.getElementById("count").textContent=c+" producto"+(c===1?"":"s");document.getElementById("mini").textContent=fmt(t)}
function openCart(){drawCart();document.getElementById("modal").classList.add("show")}function closeCart(){document.getElementById("modal").classList.remove("show")}
function drawCart(){let box=document.getElementById("items"),t=0;box.innerHTML="";Object.entries(cart).forEach(([id,q])=>{let p=product(id);t+=p[1]*q;box.innerHTML+="<div class='item'><div><b>"+p[0]+"</b><br>"+fmt(p[1]*q)+"</div><div class='qty'><button onclick=\"change('"+id+"',-1)\">−</button> "+q+" <button onclick=\"change('"+id+"',1)\">+</button></div></div>"});if(!Object.keys(cart).length)box.innerHTML="<p>Tu carrito está vacío.</p>";document.getElementById("total").textContent=fmt(t)}
function sendWA(){if(!Object.keys(cart).length)return alert("Agrega productos primero");let tipo=document.querySelector('input[name="tipo"]:checked').value,n=document.getElementById("name").value||"Sin nombre",a=document.getElementById("address").value,o=document.getElementById("obs").value,t=0;
let msg="🍟 *PEDIDO MR. FRITAS*\n\nCliente: "+n+"\nTipo: "+tipo+"\n";if(tipo==="Delivery"&&a)msg+="Dirección: "+a+"\n";msg+="\n";
Object.entries(cart).forEach(([id,q])=>{let p=product(id);t+=p[1]*q;msg+="• "+q+" x "+p[0]+" — "+fmt(p[1]*q)+"\n"});msg+="\n*TOTAL: "+fmt(t)+"*";if(o)msg+="\n\nObservaciones: "+o;window.open("https://wa.me/56988331113?text="+encodeURIComponent(msg),"_blank")}
render();update();
</script></body></html>
