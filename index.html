<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Fritas | Menú</title>
<style>
:root{--y:#ffc400;--k:#0b0b0b;--w:#fff;--g:#f2f1ed;--muted:#777}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#151515;padding-bottom:92px}
header{background:linear-gradient(145deg,#080808,#1a1a1a);color:#fff;padding:30px 16px 25px;text-align:center;border-bottom:5px solid var(--y)}
header h1{margin:0;font-size:40px;font-weight:1000;letter-spacing:-2px;font-style:italic}header h1 span{color:var(--y)}
header p{margin:7px 0 0;color:#ddd;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1.2px}
nav{display:flex;gap:8px;overflow:auto;padding:11px 12px;position:sticky;top:0;background:#fff;z-index:4;box-shadow:0 4px 14px #00000012;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;border:1px solid #e6e6e6;border-radius:999px;background:#fff;padding:10px 15px;font-weight:900;cursor:pointer}nav button.active,nav button:hover{background:var(--y);border-color:var(--y)}
main{max-width:900px;margin:auto;padding:15px 12px}.section{margin:14px 0 34px;scroll-margin-top:68px}.section h2{font-size:25px;margin:8px 2px 14px;text-transform:uppercase;font-weight:1000;letter-spacing:-.8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #0000000f;display:flex;flex-direction:column;border:1px solid #eceae4;transition:.15s}
.card:active{transform:scale(.985)}.pic{height:170px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}.pic img{width:100%;height:100%;object-fit:contain;display:block}
.info{padding:13px;display:flex;flex-direction:column;flex:1}.info h3{margin:0 0 6px;font-size:17px;text-transform:uppercase;font-weight:1000;line-height:1.05}.desc{font-size:12.5px;color:#626262;line-height:1.38;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.price{font-weight:1000;font-size:20px}.add{border:0;background:var(--y);color:#111;width:40px;height:40px;border-radius:12px;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px #0002}
.note{background:#111;color:#fff;border-radius:14px;padding:16px}.note b{color:var(--y)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#0c0c0c;color:#fff;padding:10px 13px calc(10px + env(safe-area-inset-bottom));z-index:8;box-shadow:0 -4px 18px #0003}.barin{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar #mini{color:#ddd}.cartbtn{background:var(--y);border:0;border-radius:13px;padding:13px 18px;font-weight:1000;font-size:15px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;max-width:820px;margin:auto}.sheet h2{margin:0 0 14px;font-size:27px}
.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e6e6e6;padding:12px 0}.qty button{border:0;background:#eee;border-radius:8px;width:31px;height:31px;font-weight:900}.total{font-size:24px;font-weight:1000;text-align:right;margin:18px 0}
.field{width:100%;padding:13px;border:1px solid #d5d5d5;border-radius:11px;margin:6px 0 10px;font-size:16px}.types{display:flex;gap:8px}.types label{flex:1;background:#eee;border-radius:11px;padding:12px;text-align:center;font-weight:800}.whatsapp{width:100%;background:#25d366;color:#fff;border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:1000;cursor:pointer}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:20px}
@media(max-width:390px){.pic{height:145px}.info{padding:11px}.info h3{font-size:15px}.desc{font-size:11.5px}.price{font-size:18px}}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.pic{height:190px}header{padding:38px 16px 30px}header h1{font-size:48px}}
</style>
</head>
<body>
<header><h1>MR. <span>FRITAS</span></h1><p>Smash burgers & papitas • Cunco</p></header>
<nav id="nav"></nav><main id="menu"></main>
<div class="bar"><div class="barin"><div><b id="count">0 productos</b><br><span id="mini">$0</span></div><button class="cartbtn" onclick="openCart()">Ver pedido 🛒</button></div></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>Tu pedido</h2><div id="items"></div><div class="total">Total: <span id="total">$0</span></div>
<div class="types"><label><input type="radio" name="tipo" value="Retiro en local" checked onchange="drawCart()"> Retiro</label><label><input type="radio" name="tipo" value="Delivery" onchange="drawCart()"> Delivery</label></div><div id="deliveryNote" style="display:none;margin:10px 0;padding:11px 12px;background:#fff4c2;border-radius:10px;font-size:13px;font-weight:700">🛵 Delivery radio urbano: +$2.000</div>
<input class="field" id="name" placeholder="Tu nombre"><input class="field" id="address" placeholder="Dirección (si es delivery)"><textarea class="field" id="obs" placeholder="Observaciones"></textarea>
<button class="whatsapp" onclick="sendWA()">Enviar pedido por WhatsApp</button></div></div>
<script>
const sections=[
{name:"Smash Burgers",items:[
["Smash Peanut",8990,"Carne smash, queso cheddar, tocino, mantequilla de maní • Incluye papitas","peanut.jpg"],
["Cheese Burger",4990,"Carne smash, pepinillos, mayo casera","cheese_burger.jpg"],
["Smash Bacon",9500,"Carne smash, cheddar, tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","bacon.jpg"],
["Smash Champi",7500,"Carne smash, champiñones, cebolla caramelizada, queso mantecoso, mayo casera • Incluye papitas","champi.png"],
["Smash Italiana",7500,"Carne smash, tomate, palta, mayo casera • Incluye papitas","italiana.jpg"],
["Smash Fresh",7500,"Carne smash, lechuga, cebolla morada, queso cheddar, mayo casera • Incluye papitas","fresh.jpg"],
["Mr ¼ de Kilo",13500,"3 carnes smash (255 g), triple cheddar, doble tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","cuarto_de_kilo.png"],
["Oklahoma Burger",7490,"Carne smash estilo Oklahoma con cebolla, pepinillo, queso mantecoso, mostaza • Incluye papitas","oklahoma.png"],
["Cuarto de Libra",5990,"Carne smash (120 g), doble cheddar, cebolla, ketchup, mostaza, pepinillo","cuarto_de_libra.png"],
["Smash Whopper",5990,"Carne smash, lechuga, cebolla, tomate, mayo casera","whopper.png"],
["Smash Clásica",6900,"Carne smash, queso cheddar, cebolla morada, pepinillos, mayonesa • Incluye papitas","clasica.jpg"],
["Smash Doble",8900,"Doble carne smash, doble queso cheddar, cebolla morada, pepinillos, mayo casera",""]]},
{name:"Arma tu Smash",items:[["Base Smash",5500,"Pan brioche, carne smash y mayo casera • Incluye papas fritas"],["Carne smash extra",2000,"Agregado"],["Tocino crispy",1500,"Agregado"],["Queso cheddar",1000,"Agregado"],["Queso mantecoso",1000,"Agregado"],["Champiñones",1000,"Agregado"],["Cebolla caramelizada",800,"Agregado"],["Cebolla morada",800,"Agregado"],["Pepinillos",800,"Agregado"]]},
{name:"Papas & Toppings",items:[["Papas fritas base",3000,"Papas fritas naturales • tamaño base"],["Papas fritas grande",5000,"Papas fritas naturales • tamaño grande"],["Carne mechada",2000,"Topping"],["Pollo",2000,"Topping"],["Tocino crispy",2500,"Topping"],["Salchichas",1500,"Topping"],["Queso fundido",1500,"Topping"],["Queso cheddar",1500,"Topping"],["Cebolla caramelizada",1000,"Topping"],["Pimentón",1000,"Topping"],["Champiñón",1000,"Topping"],["Choclo",1000,"Topping"],["Salsa premium",500,"Mayo casera, mayo ajo, mayo cilantro, salsa de queso, choclo o tocino"]]},
{name:"Promos",items:[["Combo para 2",17900,"2 smash clásicas + papas + salsas + 2 bebidas • Exclusivo consumo local"]]}
];
let cart={}; const fmt=n=>"$"+n.toLocaleString("es-CL");
function render(){const nav=document.getElementById("nav"),m=document.getElementById("menu");nav.innerHTML="";m.innerHTML="";
sections.forEach((s,si)=>{let b=document.createElement("button");b.textContent=s.name;b.onclick=()=>document.getElementById("s"+si).scrollIntoView({behavior:"smooth"});if(!si)b.className="active";nav.appendChild(b);
let sec=document.createElement("section");sec.className="section";sec.id="s"+si;sec.innerHTML="<h2>"+s.name+"</h2><div class='grid'></div>";let g=sec.querySelector(".grid");
s.items.forEach((p,pi)=>{let id=si+"-"+pi,d=document.createElement("div");d.className="card";d.innerHTML="<div class='pic'>"+(p[3]?"<img src=\'"+p[3]+"\' alt=\'"+p[0]+"\' loading=\'lazy\'>":(si===2?"🍟":"🍔"))+"</div><div class='info'><h3>"+p[0]+"</h3><div class='desc'>"+p[2]+"</div><div class='row'><span class='price'>"+fmt(p[1])+"</span><button class='add' onclick=\"add('"+id+"')\">+</button></div></div>";g.appendChild(d)});m.appendChild(sec)})}
function product(id){let [a,b]=id.split("-").map(Number);return sections[a].items[b]}function add(id){cart[id]=(cart[id]||0)+1;update()}
function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];drawCart();update()}
function update(){let c=0,t=0;Object.entries(cart).forEach(([id,q])=>{c+=q;t+=product(id)[1]*q});document.getElementById("count").textContent=c+" producto"+(c===1?"":"s");document.getElementById("mini").textContent=fmt(t)}
function openCart(){drawCart();document.getElementById("modal").classList.add("show")}function closeCart(){document.getElementById("modal").classList.remove("show")}
function drawCart(){let box=document.getElementById("items"),t=0;box.innerHTML="";Object.entries(cart).forEach(([id,q])=>{let p=product(id);t+=p[1]*q;box.innerHTML+="<div class='item'><div><b>"+p[0]+"</b><br>"+fmt(p[1]*q)+"</div><div class='qty'><button onclick=\"change('"+id+"',-1)\">−</button> "+q+" <button onclick=\"change('"+id+"',1)\">+</button></div></div>"});if(!Object.keys(cart).length)box.innerHTML="<p>Tu carrito está vacío.</p>";let tipo=document.querySelector('input[name="tipo"]:checked')?.value||"Retiro en local",delivery=tipo==="Delivery"?2000:0;if(delivery){box.innerHTML+="<div class='item'><div><b>🛵 Delivery radio urbano</b></div><div><b>"+fmt(delivery)+"</b></div></div>"}document.getElementById("deliveryNote").style.display=delivery?"block":"none";document.getElementById("total").textContent=fmt(t+delivery)}
function sendWA(){if(!Object.keys(cart).length)return alert("Agrega productos primero");let tipo=document.querySelector('input[name="tipo"]:checked').value,n=document.getElementById("name").value||"Sin nombre",a=document.getElementById("address").value,o=document.getElementById("obs").value,t=0;
let msg="🍟 *PEDIDO MR. FRITAS*\n\nCliente: "+n+"\nTipo: "+tipo+"\n";if(tipo==="Delivery"&&a)msg+="Dirección: "+a+"\n";msg+="\n";
Object.entries(cart).forEach(([id,q])=>{let p=product(id);t+=p[1]*q;msg+="• "+q+" x "+p[0]+" — "+fmt(p[1]*q)+"\n"});if(tipo==="Delivery"){t+=2000;msg+="• Delivery radio urbano — "+fmt(2000)+"\n"}msg+="\n*TOTAL: "+fmt(t)+"*";if(o)msg+="\n\nObservaciones: "+o;window.open("https://wa.me/56988331113?text="+encodeURIComponent(msg),"_blank")}
render();update();
</script></body></html>
