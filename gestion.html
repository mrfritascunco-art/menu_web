<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="gestion-manifest.json"><title>Mr. Fritas Gestión</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1e9;font:16px Arial,sans-serif;color:#161616}header{background:#111;color:#ffc400;padding:24px 18px;text-align:center;border-bottom:5px solid #ffc400}header h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#eee}main{max-width:600px;margin:20px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 20px #0001;margin-bottom:16px}input,button{width:100%;font:inherit;padding:14px;margin:7px 0;border-radius:11px;border:1px solid #ccc}button{background:#ffc400;color:#111;border:0;font-weight:800;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{background:#111;color:white;text-decoration:none;border-radius:15px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:bold;text-align:center;min-height:130px}.module span{font-size:34px}.muted{color:#555;font-size:14px;line-height:1.5}.error{color:#ad2424}#logout{background:#eee}footer{text-align:center;color:#666;font-size:12px;padding:12px}</style></head><body><header><h1>🍟 MR. FRITAS</h1><p>BURGER CO. · GESTIÓN</p></header><main><section class="panel" id="login"><h2>🔐 Acceso del personal</h2><input id="email" type="email" autocomplete="username" placeholder="Correo electrónico"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="enter">Ingresar</button><p id="message" class="muted">Ingresa con tu cuenta de personal de Mr. Fritas.</p></section><section id="dashboard" class="hidden"><div class="panel"><h2>Panel de trabajo</h2><p id="who" class="muted"></p><p class="muted">Verás solo los módulos autorizados para tu cuenta. Cada módulo puede solicitarte ingresar nuevamente.</p><div class="grid" id="modules"></div><button id="logout">Cerrar sesión</button></div></section></main><footer>Mr. Fritas Burger Co. · Sistema interno</footer><script>const API="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";const $=id=>document.getElementById(id);let token="";async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{"apikey":KEY,"Authorization":"Bearer "+(token||KEY),"Content-Type":"application/json",...(options.headers||{})}});if(!r.ok)throw Error("Error "+r.status);return r.json()}async function role(name){try{return await request("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:name})})===true}catch(e){return false}}async function login(){const m=$("message");m.textContent="Verificando permisos…";$("enter").disabled=true;try{const result=await request("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});token=result.access_token;const checks=await Promise.all(["admin","cocina","caja"].map(role));if(!checks.some(Boolean))throw Error("Tu cuenta no tiene permisos habilitados.");const modules=[["🍳","Cocina","cocina.html",checks[0]||checks[1]],["💵","Caja","caja.html",checks[0]||checks[2]],["⚙️","Administración","admin-promociones.html",checks[0]]];$("modules").innerHTML=modules.filter(x=>x[3]).map(x=>'<a class="module" href="'+x[2]+'"><span>'+x[0]+'</span>'+x[1]+'</a>').join("");$("who").textContent=$("email").value.trim();$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");m.textContent="";}catch(e){token="";m.textContent=e.message==="Error 400"?"Correo o contraseña incorrectos.":e.message;m.classList.add("error")}finally{$("enter").disabled=false}}$("enter").onclick=login;$("password").onkeydown=e=>{if(e.key==="Enter")login()};$("logout").onclick=()=>{token="";$("password").value="";$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");$("message").textContent="Ingresa con tu cuenta de personal de Mr. Fritas."};</script></body></html>
