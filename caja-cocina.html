<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mr Fritas · Caja + Cocina</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#151515;color:white}header{height:58px;display:flex;align-items:center;gap:10px;padding:5px 12px;background:#111}header img{height:48px;width:56px;object-fit:contain}header b{color:#ffc400}.tabs{display:flex;gap:8px;padding:6px;background:#222}.tabs button{flex:1;background:#444;color:white;border:0;border-radius:10px;padding:12px;font-weight:900;font-size:16px}.tabs button.on{background:#ffc400;color:#111}.view{height:calc(100dvh - 114px);position:relative}.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white;visibility:hidden}.view iframe.on{visibility:visible}.edge{position:absolute;top:0;bottom:0;width:19px;z-index:3;touch-action:pan-y}.edge.left{left:0}.edge.right{right:0}.login{margin:8vh auto;padding:22px;max-width:390px;background:#252525;border-radius:16px}.login input{display:block;width:100%;padding:14px;margin:12px 0;border-radius:8px;border:1px solid #777;font-size:16px}.login button{width:100%;padding:14px;background:#ffc400;border:0;border-radius:8px;font-weight:bold}.hidden{display:none}.error{color:#ffaaa0}.exit{margin-left:auto;background:#333;color:white;border:1px solid #666;border-radius:8px;padding:8px}</style></head><body><header><img src="logo.png.png" alt="Mr Fritas"><b>CAJA + COCINA</b><button class="exit hidden" id="exit">Salir</button></header><section class="login" id="login"><h2>🔐 Ingreso único</h2><p>Usa una cuenta con permisos de Caja y Cocina.</p><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter">Ingresar</button><p class="error" id="error"></p></section><div id="app" class="hidden"><div class="tabs"><button id="cashBtn">💰 CAJA</button><button id="kitchenBtn">🔥 COCINA</button></div><div class="view" id="view"><iframe id="cash" title="Caja"></iframe><iframe id="kitchen" title="Cocina"></iframe><div class="edge left" id="leftEdge"></div><div class="edge right" id="rightEdge"></div></div></div><script src="gestion-sesion.js"></script><script>
const $=id=>document.getElementById(id),BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";let loaded=false;
function switchTo(which){for(const n of ["cash","kitchen"]){$(n).classList.toggle("on",n===which);$(n+"Btn").classList.toggle("on",n===which)}}
function openApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("exit").classList.remove("hidden");if(!loaded){$("cash").src="caja.html?v=20261020-burger-dia";$("kitchen").src="cocina.html?v=20261020-burger-dia";loaded=true}switchTo("kitchen")}
async function signIn(){$("error").textContent="Verificando…";$("enter").disabled=true;try{const r=await fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});if(!r.ok)throw Error("Correo o contraseña incorrectos");const data=await r.json();const [a,b]=await Promise.all([MFSession.allowed(data.access_token,"caja"),MFSession.allowed(data.access_token,"cocina")]);if(!a||!b)throw Error("Esta cuenta necesita permisos de Caja y Cocina");MFSession.save(data,true);$("password").value="";openApp()}catch(e){$("error").textContent=e.message}finally{$("enter").disabled=false}}
$("enter").onclick=signIn;$("password").onkeydown=e=>{if(e.key==="Enter")signIn()};$("cashBtn").onclick=()=>switchTo("cash");$("kitchenBtn").onclick=()=>switchTo("kitchen");$("exit").onclick=()=>{MFSession.clear();location.reload()};
let x=0,y=0;const v=$("view");v.addEventListener("touchstart",e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});v.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>110&&Math.abs(dx)>Math.abs(dy)*1.6)switchTo(dx<0?"kitchen":"cash")},{passive:true});
for(const edge of [$("leftEdge"),$("rightEdge")]){let start=0;edge.addEventListener("touchstart",e=>{start=e.touches[0].clientX},{passive:true});edge.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>60)switchTo(dx<0?"kitchen":"cash")},{passive:true})}
(async()=>{try{const [a,b]=await Promise.all([MFSession.get("caja"),MFSession.get("cocina")]);if(a&&b)openApp()}catch(e){}})();
</script></body></html>
