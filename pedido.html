<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Fritas | Seguir pedido</title>
<style>
:root{--y:#ffc400;--k:#111;--g:#f2f1ed;--green:#16834f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--g);color:#111}header{background:#111;color:#fff;text-align:center;padding:20px 16px;border-bottom:5px solid var(--y)}header img{width:min(210px,62vw)}header b{display:block;margin-top:8px;font-size:17px}main{max-width:620px;margin:auto;padding:18px}.box{background:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 20px #0001}.order{text-align:center}.order h1{font-size:26px;margin:4px 0}.type{color:#666;font-weight:800;margin-bottom:20px}.steps{position:relative;margin:18px 0;text-align:left}.step{display:flex;gap:14px;align-items:flex-start;min-height:72px;position:relative}.dot{width:32px;height:32px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:1000;z-index:2;flex:0 0 32px}.step:not(:last-child):after{content:"";position:absolute;left:15px;top:31px;width:3px;height:42px;background:#ddd}.step.done .dot,.step.current .dot{background:var(--y)}.step.done:not(:last-child):after{background:var(--y)}.step.current .label{font-weight:1000}.label{font-size:17px;padding-top:5px}.sub{font-size:13px;color:#777;margin-top:4px}.received{display:none;width:100%;border:0;border-radius:14px;padding:16px;background:var(--green);color:#fff;font-size:17px;font-weight:1000;cursor:pointer;margin-top:12px}.msg{text-align:center;color:#666;font-weight:700;padding:25px 5px}.refresh{text-align:center;color:#777;font-size:12px;margin-top:18px}.back{display:block;text-align:center;margin-top:14px;color:#111;font-weight:900;text-decoration:none}
</style></head>
<body><header><img src="logo.png.png" alt="Mr. Fritas"><b>📍 SEGUIR MI PEDIDO</b></header>
<main><section class="box"><div id="content" class="msg">Consultando tu pedido…</div></section><a class="back" href="./">← Volver al menú</a></main>
<script>
const URL="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT",token=new URLSearchParams(location.search).get("t")||"";
const labels={nuevo:["🧾","Pedido recibido","Ya tenemos tu pedido"],preparando:["🔥","Preparando","Estamos preparando tu pedido"],listo:["✅","Listo","Tu pedido está listo"],en_reparto:["🛵","En reparto","Tu pedido va en camino"],recibido:["📦","Recibido","Pedido entregado"],entregado:["🤝","Entregado","Pedido completado"]};
async function rpc(name){let r=await fetch(URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_token:token})});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(r){let delivery=String(r.order_type||"").toLowerCase().includes("delivery"),flow=delivery?["nuevo","preparando","listo","en_reparto","recibido"]:["nuevo","preparando","listo","entregado"],pos=flow.indexOf(r.status);let steps=flow.map((s,i)=>{let x=labels[s],cl=i<pos?"done":i===pos?"current":"";return '<div class="step '+cl+'"><div class="dot">'+x[0]+'</div><div><div class="label">'+x[1]+'</div>'+(i===pos?'<div class="sub">'+x[2]+'</div>':'')+'</div></div>'}).join("");document.getElementById("content").className="order";document.getElementById("content").innerHTML='<h1>Pedido #'+esc(r.order_number)+'</h1><div class="type">'+esc(r.order_type)+'</div><div class="steps">'+steps+'</div>'+(delivery&&r.status==="en_reparto"?'<button class="received" id="received" style="display:block">📦 RECIBÍ MI PEDIDO</button>':'')+'<div class="refresh">El estado se actualiza automáticamente.</div>';let b=document.getElementById("received");if(b)b.onclick=confirmReceived}
async function load(){if(!token){document.getElementById("content").textContent="Enlace de seguimiento inválido.";return}try{let rows=await rpc("get_order_tracking");if(!rows.length){document.getElementById("content").textContent="No encontramos este pedido.";return}render(rows[0])}catch(e){document.getElementById("content").textContent="No pudimos consultar el pedido. Intenta nuevamente."}}
async function confirmReceived(){let b=document.getElementById("received");b.disabled=true;b.textContent="Confirmando…";try{let ok=await rpc("confirm_order_received");if(ok)await load();else{b.disabled=false;b.textContent="📦 RECIBÍ MI PEDIDO"}}catch(e){b.disabled=false;b.textContent="📦 RECIBÍ MI PEDIDO"}}
load();setInterval(load,5000);
</script></body></html>
