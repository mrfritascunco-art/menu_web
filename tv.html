<header><div class="brand-wrap"><img class="tv-logo" src="logo.png.png" alt="Logo Mr Fritas"><div class="brand">MR FRITAS <span>BURGER CO.</span></div></div><div class="contact"><small>📲 PEDIDOS Y CONSULTAS</small>+56 9 8833 1113</div></header>
<main><div class="promo-area"><section class="copy"><div class="tag" id="tag">🍔 NUESTRAS BURGERS</div><div class="day-banner" id="dayBanner">🔥 ¡OFERTA BURGER DEL DÍA! 🔥</div><h1 id="name">Cargando menú…</h1><div class="ingredients-title">INGREDIENTES</div><div class="desc" id="desc">Carne fresca, jamás congelada.</div><div class="regular-price" id="regularPrice"></div><div class="day-price-label" id="dayPriceLabel">PRECIO ESPECIAL HOY</div><div class="price" id="price"></div></section><div class="photo" id="photo"><span class="placeholder">🍔</span></div></div><aside class="orders-panel"><div class="orders-heading">🍟 TUS PEDIDOS</div><div class="orders-board"><section class="stage"><div class="stage-title waiting-title">⏳ EN ESPERA</div><div class="stage-items" id="waiting"></div></section><section class="stage"><div class="stage-title preparing-title">👨‍🍳 EN PREPARACIÓN</div><div class="stage-items" id="preparing"></div></section><section class="stage"><div class="stage-title ready-title">🔔 LISTO</div><div class="stage-items" id="ready"></div></section></div></aside></main>

<script>
const BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
const $=id=>document.getElementById(id);
const FALLBACK_IMAGES=["peanut.jpg","cheese_burger.jpg","bacon.jpg","champi.png","italiana.jpg","fresh.jpg","cuarto_de_kilo.png","oklahoma.png","cuarto_de_libra.png","whopper.png","clasica.jpg","Hamburguesa doble con queso y pepinillos.png","cheese_bacon.png"];
const MENU_BURGER_INGREDIENTS=["Carne smash, queso cheddar, tocino, mantequilla de maní • Incluye papitas","Carne smash, pepinillos, mayo casera","Carne smash, cheddar, tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","Carne smash, champiñones, cebolla caramelizada, queso mantecoso, mayo casera • Incluye papitas","Carne smash, tomate, palta, mayo casera • Incluye papitas","Carne smash, lechuga, cebolla morada, queso cheddar, mayo casera • Incluye papitas","3 carnes smash (255 g), triple cheddar, doble tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","Carne smash estilo Oklahoma con cebolla, pepinillo, queso mantecoso, mostaza • Incluye papitas","Carne smash (120 g), doble cheddar, cebolla, ketchup, mostaza, pepinillo","Carne smash, lechuga, cebolla, tomate, mayo casera","Carne smash, queso cheddar, cebolla morada, pepinillos, mayonesa • Incluye papitas","Doble carne smash, doble queso cheddar, cebolla morada, pepinillos, mayo casera","Carne smash, queso cheddar, tocino y mayonesa Kraft • Incluye papas fritas"];
const MENU_IMAGE_ROOT="https://mrfritascunco-art.github.io/menu_web/";
function imageFor(id,url){const m=/^0-(\d+)$/.exec(id||"");const filename=m?FALLBACK_IMAGES[Number(m[1])]||"":"";const chosen=filename||(id==="1-0"?"Arma tu burger graffiti.png":"")||url;return chosen?new URL(chosen,MENU_IMAGE_ROOT).href:"";}
let slides=[],current=0,slideTimer=null;let tvSettings={slide_seconds:10,voice_enabled:true,show_promotions:true,show_customer_names:true,ready_takeaway_text:"¡La felicidad también viene para llevar!",ready_counter_text:"¡La felicidad se retira en el mesón!"};
function scheduleSlides(){if(slideTimer)clearInterval(slideTimer);slideTimer=setInterval(()=>{current++;show()},Math.max(4,Number(tvSettings.slide_seconds)||10)*1000)}
async function refreshTvSettings(){try{const rows=await get("tv_settings?select=*&id=eq.1");if(!rows[0])return;const previous=tvSettings.slide_seconds;tvSettings={...tvSettings,...rows[0]};soundEnabled=tvSettings.voice_enabled;if(previous!==tvSettings.slide_seconds)scheduleSlides()}catch(e){console.warn("Configuración TV",e)}}
function ingredientsFor(id,description){const m=/^0-(\d+)$/.exec(id||"");return (m?MENU_BURGER_INGREDIENTS[Number(m[1])]:"")||description||"";}
const money=n=>"$"+Number(n).toLocaleString("es-CL");
async function get(path){const r=await fetch(BASE+"/rest/v1/"+path,{headers:{apikey:KEY},cache:"no-store"});if(!r.ok)throw Error("Menú no disponible");return r.json()}
function show(){if(!slides.length){$("name").textContent="PRONTO NUEVAS BURGERS";$("desc").textContent="Mr Fritas Burger Co.";return}
const s=slides[current%slides.length];$("tag").textContent=s.tag;$("name").textContent=s.name;$("desc").textContent=s.description||"Preparada al momento con nuestra calidad Mr Fritas.";$("price").textContent=money(s.price);const isDay=s.isDay===true;$("dayBanner").classList.toggle("active",isDay);$("regularPrice").classList.toggle("active",isDay);$("dayPriceLabel").classList.toggle("active",isDay);$("regularPrice").innerHTML=isDay?"Precio normal: <s>"+money(s.regularPrice)+"</s>":"";
$("photo").replaceChildren();if(s.image){const img=document.createElement("img");img.src=s.image;img.alt=s.name;img.loading="eager";if(s.name&&/smash peanut/i.test(s.name)){img.style.maxWidth="67%";img.style.maxHeight="67%";}img.onerror=()=>{console.warn("Foto no disponible:",img.src);$("photo").textContent="🍔";};$("photo").append(img)}else $("photo").textContent="🍔"}
async function refreshMenu(){try{
const [controls,custom,promos]=await Promise.all([
get("menu_control?select=product_id,product_name,description,image_url,price,available,burger_of_day,day_price"),
get("menu_custom?select=id,category,name,description,image_url,price,available"),
get("menu_promotions?select=id,name,description,image_url,price,active&active=eq.true")]);
const tvImages=await get("tv_product_images?select=product_key,image_url").catch(()=>[]);const tvImageFor=(key,fallback)=>tvImages.find(x=>x.product_key===key)?.image_url||fallback;
const next=[];
const day=controls.find(x=>x.burger_of_day===true&&x.available!==false&&x.day_price!=null&&/^0-\d+$/.test(x.product_id));
if(day){next.push({name:day.product_name,description:ingredientsFor(day.product_id,day.description),image:tvImageFor("original:"+day.product_id,imageFor(day.product_id,day.image_url)),price:day.day_price,regularPrice:day.price,isDay:true,tag:"🔥 BURGER DEL DÍA"});next.push({name:day.product_name,description:ingredientsFor(day.product_id,day.description),image:imageFor(day.product_id,day.image_url),price:day.day_price,regularPrice:day.price,isDay:true,tag:"🔥 BURGER DEL DÍA"});}
next.push(...controls.filter(x=>x.available!==false&&/^[01]-\d+$/.test(x.product_id)&&x.price!=null&&(!day||x.product_id!==day.product_id)).map(x=>({name:x.product_name,description:ingredientsFor(x.product_id,x.description),image:tvImageFor("original:"+x.product_id,imageFor(x.product_id,x.image_url)),price:x.price,tag:"🍔 SMASH BURGERS"})));
next.push(...custom.filter(x=>x.available!==false&&x.category==="Hamburguesas").map(x=>({name:x.name,description:x.description,image:tvImageFor("custom:"+x.id,imageFor(null,x.image_url)),price:x.price,tag:"🍔 NUESTRAS BURGERS"})));
if(tvSettings.show_promotions)next.push(...promos.map(x=>({name:x.name,description:x.description,image:imageFor(null,x.image_url),price:x.price,tag:"🔥 PROMOCIONES"})));
slides=next.filter(x=>x.name&&Number.isFinite(Number(x.price))&&Number(x.price)>=0);if(current>=slides.length)current=0;show()
}catch(e){console.warn("La TV conservará el último menú cargado",e)}}
function renderStage(id,orders){const el=$(id);el.replaceChildren();if(!orders.length){const empty=document.createElement("span");empty.className="stage-empty";empty.textContent="Sin pedidos";el.append(empty);return}for(const o of orders.slice(0,9)){const badge=document.createElement("span");badge.className="stage-number"+(id==="ready"?" ready":"");const code=o.order_code||("#"+o.order_number);badge.textContent=/^M-/.test(code)?"🍽️ "+code+(tvSettings.show_customer_names&&o.customer_name?" · "+o.customer_name:""):code;el.append(badge)}}
let audioCtx=null,soundEnabled=true,readyInitialized=false,previousReady=new Set();
async function prepareAudio(){
 try{
  const Context=window.AudioContext||window.webkitAudioContext;
  if(Context){if(!audioCtx)audioCtx=new Context();if(audioCtx.state==="suspended")await audioCtx.resume()}
  if("speechSynthesis" in window)speechSynthesis.getVoices();
 }catch(e){console.warn("Audio pendiente de permiso del navegador",e)}
}
prepareAudio();
document.addEventListener("pointerdown",prepareAudio,{passive:true});
document.addEventListener("keydown",prepareAudio);
function playPop(){
 if(!soundEnabled||!audioCtx||audioCtx.state!=="running")return;
 const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type="sine";osc.frequency.setValueAtTime(720,t);osc.frequency.exponentialRampToValueAtTime(360,t+.11);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.20,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.14);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.15);
}
function bestSpanishVoice(){if(!("speechSynthesis" in window))return null;const voices=speechSynthesis.getVoices();const regional=voices.filter(v=>/^es[-_](CL|419|MX|AR|CO|PE|US|UY)/i.test(v.lang));return regional.find(v=>/^es[-_]CL$/i.test(v.lang))||regional[0]||null}
function speakTv(text){if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang="es-CL";u.rate=.91;u.pitch=1.04;u.volume=1;u.voice=bestSpanishVoice();speechSynthesis.speak(u)}
function pronounceDigits(s){return String(s).split("").map(x=>({0:"cero",1:"uno",2:"dos",3:"tres",4:"cuatro",5:"cinco",6:"seis",7:"siete",8:"ocho",9:"nueve"}[x]||x)).join(", ")}
const announcedKey="mf_tv_announced_v2";
function alreadyAnnounced(o){const id=String(o.order_number||"");if(!id)return false;try{const now=Date.now();const data=JSON.parse(sessionStorage.getItem(announcedKey)||"{}");for(const k of Object.keys(data))if(now-data[k]>86400000)delete data[k];if(data[id])return true;data[id]=now;sessionStorage.setItem(announcedKey,JSON.stringify(data));return false}catch(e){return false}}
function announceReady(orders){if(!soundEnabled||!orders.length)return;if(!("speechSynthesis" in window))return;for(const order of orders){if(alreadyAnnounced(order))continue;playPop();const code=String(order.order_code||("#"+order.order_number)||"").trim();const mesa=/^M-/i.test(code);const number=code.replace(/^(M-|MR-|#)/i,"");const spoken=mesa?"eme, "+pronounceDigits(number):"número "+(/^[0-9]+$/.test(number)?String(Number(number)):number);const name=mesa&&tvSettings.show_customer_names&&order.customer_name?String(order.customer_name).trim().replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ '-]/g,"").slice(0,40):"";speakTv("¡Pedido "+spoken+(name?", "+name:"")+"! "+(mesa?tvSettings.ready_counter_text:tvSettings.ready_takeaway_text))}}
function readyKey(o){return String(o.order_code||o.order_number||o.id||"")}
async function refreshReady(){try{const r=await fetch(BASE+"/rest/v1/rpc/tv_order_board_v2",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:"{}",cache:"no-store"});if(!r.ok)throw Error("No se pudo consultar el panel");const rows=await r.json();document.querySelector(".screen").classList.toggle("idle",!rows.some(o=>["espera","preparacion","listo"].includes(o.stage)));renderStage("waiting",rows.filter(o=>o.stage==="espera"));renderStage("preparing",rows.filter(o=>o.stage==="preparacion"));const readyOrders=rows.filter(o=>o.stage==="listo");renderStage("ready",readyOrders);const nowReady=new Set(readyOrders.map(readyKey));if(readyInitialized){const newlyReady=readyOrders.filter(o=>!previousReady.has(readyKey(o)));if(newlyReady.length)announceReady(newlyReady)}previousReady=nowReady;readyInitialized=true}catch(e){console.warn("Panel de pedidos:",e)}}
async function refreshTicker(){try{const [messages,reviews]=await Promise.all([get("tv_ticker_messages?select=message&active=eq.true&order=id.asc"),get("tv_ticker_reviews?select=customer_name,review_text&active=eq.true&order=id.asc").catch(()=>[])]);const texts=messages.map(x=>String(x.message||"").trim()).filter(Boolean);const ticker=$("ticker"),track=$("tickerTrack");if(!texts.length&&!reviews.length){ticker.hidden=true;return}const signature=JSON.stringify([texts,reviews]);if(track.dataset.signature===signature)return;track.dataset.signature=signature;track.replaceChildren();for(let i=0;i<2;i++){const span=document.createElement("span");span.textContent=texts.map(x=>" ✦ "+x+" ").join("   ");track.append(span);for(const review of reviews){const block=document.createElement("span");block.className="ticker-review";const name=document.createElement("span");name.className="review-name";name.textContent="★★★★★ "+review.customer_name;const comment=document.createElement("span");comment.className="review-text";comment.textContent="“"+review.review_text+"”";block.append(name,comment);track.append(block)}}ticker.hidden=false}catch(e){console.warn("Cinta informativa",e)}}
refreshTicker();setInterval(refreshTicker,60000);
refreshTvSettings().then(refreshMenu);refreshReady();scheduleSlides();setInterval(()=>{refreshTvSettings().then(refreshMenu)},60000);setInterval(refreshReady,6000);
