<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr Fritas · TV del local</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:white;font-family:Arial,Helvetica,sans-serif}
.screen{height:100vh;display:grid;grid-template-rows:12vh minmax(0,1fr) 18vh;background:radial-gradient(ellipse at 65% 38%,#30302a 0%,#101010 56%,#080808 100%)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:2px solid #3a320d}
.brand{font-weight:1000;font-size:clamp(26px,3.2vw,68px);letter-spacing:-1px;color:#ffcf00}.brand span{color:white}.topline{color:#e2e2e2;font-size:clamp(14px,1.45vw,28px);font-weight:bold}
main{min-height:0;display:grid;grid-template-columns:51% 49%;align-items:center;padding:2vh 5vw;gap:2vw}
.copy{min-width:0}.tag{display:inline-block;color:#171717;background:#ffd000;padding:.55em 1em;border-radius:100px;font-size:clamp(13px,1.25vw,24px);font-weight:900;letter-spacing:1px}
.day-banner{display:none;margin-top:1.3vh;background:#e62626;color:white;border-radius:12px;padding:.7vh 1.2vw;font-size:clamp(17px,2vw,38px);font-weight:1000;letter-spacing:.04em;box-shadow:0 0 30px #e6262655;transform:rotate(-1deg);width:max-content;max-width:100%}.day-banner.active{display:block}.regular-price{display:none;font-size:clamp(18px,2vw,40px);color:#bdbdbd;margin-top:1vh;font-weight:700}.regular-price.active{display:block}.regular-price s{color:#f18d8d;text-decoration-thickness:3px}.day-price-label{font-size:clamp(14px,1.5vw,28px);color:#ffd000;font-weight:900;margin-top:1vh;display:none}.day-price-label.active{display:block}
h1{font-size:clamp(35px,5.4vw,110px);line-height:.98;letter-spacing:-.05em;margin:2.5vh 0 1.8vh;overflow-wrap:anywhere}
.desc{font-size:clamp(15px,1.55vw,32px);line-height:1.35;color:#d6d6d6;max-width:46vw;max-height:18vh;overflow:hidden}
.price{font-size:clamp(50px,6.2vw,128px);font-weight:1000;color:#ffcf00;margin-top:2vh;letter-spacing:-.055em}
.photo{height:100%;max-height:58vh;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 28px #0009)}.placeholder{font-size:14vw}
footer{border-top:3px solid #ffcf00;background:#181818;display:flex;align-items:center;gap:3vw;padding:1.5vh 4vw}
.ready-label{font-size:clamp(17px,1.9vw,37px);font-weight:1000;color:#ffcf00;min-width:24vw}.ready-numbers{display:flex;align-items:center;gap:1.5vw;overflow:hidden;flex:1}.number{background:#ffcf00;color:#111;border-radius:14px;min-width:7vw;padding:.6vh 1vw;text-align:center;font-size:clamp(28px,3.7vw,76px);font-weight:1000}.empty{color:#aaa;font-size:clamp(15px,1.5vw,29px)}.status{position:absolute;right:1vw;top:1vh;color:#999;font-size:12px}
@media(max-aspect-ratio:1.4){main{grid-template-columns:53% 47%}h1{font-size:5vw}.desc{font-size:1.7vw}}
</style></head><body><div class="screen">
<header><div class="brand">MR FRITAS <span>BURGER CO.</span></div><div class="topline">🍔 SMASH BURGERS · CUNCO</div></header>
<main><section class="copy"><div class="tag" id="tag">🍔 NUESTRAS BURGERS</div><div class="day-banner" id="dayBanner">🔥 ¡OFERTA BURGER DEL DÍA! 🔥</div><h1 id="name">Cargando menú…</h1><div class="desc" id="desc">Carne fresca, jamás congelada.</div><div class="regular-price" id="regularPrice"></div><div class="day-price-label" id="dayPriceLabel">PRECIO ESPECIAL HOY</div><div class="price" id="price"></div></section><div class="photo" id="photo"><span class="placeholder">🍔</span></div></main>
<footer><div class="ready-label">🔔 PEDIDOS LISTOS<br>PARA RETIRAR</div><div class="ready-numbers" id="ready"><span class="empty">Los números aparecerán aquí cuando Cocina los marque como listos.</span></div></footer>
</div>
<script>
const BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
const $=id=>document.getElementById(id);
const FALLBACK_IMAGES=["peanut.jpg","cheese_burger.jpg","bacon.jpg","champi.png","italiana.jpg","fresh.jpg","cuarto_de_kilo.png","oklahoma.png","cuarto_de_libra.png","whopper.png","clasica.jpg","Hamburguesa doble con queso y pepinillos.png","cheese_bacon.jpg"];
const MENU_BURGER_INGREDIENTS=["Carne smash, queso cheddar, tocino, mantequilla de maní • Incluye papitas","Carne smash, pepinillos, mayo casera","Carne smash, cheddar, tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","Carne smash, champiñones, cebolla caramelizada, queso mantecoso, mayo casera • Incluye papitas","Carne smash, tomate, palta, mayo casera • Incluye papitas","Carne smash, lechuga, cebolla morada, queso cheddar, mayo casera • Incluye papitas","3 carnes smash (255 g), triple cheddar, doble tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","Carne smash estilo Oklahoma con cebolla, pepinillo, queso mantecoso, mostaza • Incluye papitas","Carne smash (120 g), doble cheddar, cebolla, ketchup, mostaza, pepinillo","Carne smash, lechuga, cebolla, tomate, mayo casera","Carne smash, queso cheddar, cebolla morada, pepinillos, mayonesa • Incluye papitas","Doble carne smash, doble queso cheddar, cebolla morada, pepinillos, mayo casera","Carne smash, queso cheddar, tocino y mayonesa Kraft • Incluye papas fritas"];
const MENU_IMAGE_ROOT="https://mrfritascunco-art.github.io/menu_web/";
function imageFor(id,url){const m=/^0-(\d+)$/.exec(id||"");const filename=m?FALLBACK_IMAGES[Number(m[1])]||"":"";const chosen=url||filename;return chosen?new URL(chosen,MENU_IMAGE_ROOT).href:"";}
let slides=[],current=0;
function ingredientsFor(id,description){const m=/^0-(\d+)$/.exec(id||"");return description|| (m?MENU_BURGER_INGREDIENTS[Number(m[1])]:"")||"";}
const money=n=>"$"+Number(n).toLocaleString("es-CL");
async function get(path){const r=await fetch(BASE+"/rest/v1/"+path,{headers:{apikey:KEY},cache:"no-store"});if(!r.ok)throw Error("Menú no disponible");return r.json()}
function show(){if(!slides.length){$("name").textContent="PRONTO NUEVAS BURGERS";$("desc").textContent="Mr Fritas Burger Co.";return}
const s=slides[current%slides.length];$("tag").textContent=s.tag;$("name").textContent=s.name;$("desc").textContent=s.description||"Preparada al momento con nuestra calidad Mr Fritas.";$("price").textContent=money(s.price);const isDay=s.isDay===true;$("dayBanner").classList.toggle("active",isDay);$("regularPrice").classList.toggle("active",isDay);$("dayPriceLabel").classList.toggle("active",isDay);$("regularPrice").innerHTML=isDay?"Precio normal: <s>"+money(s.regularPrice)+"</s>":"";
$("photo").replaceChildren();if(s.image){const img=document.createElement("img");img.src=s.image;img.alt=s.name;img.onerror=()=>{console.warn("Foto no disponible:",img.src);$("photo").textContent="🍔";};$("photo").append(img)}else $("photo").textContent="🍔"}
async function refreshMenu(){try{
const [controls,custom,promos]=await Promise.all([
get("menu_control?select=product_id,product_name,description,image_url,price,available,burger_of_day,day_price"),
get("menu_custom?select=id,category,name,description,image_url,price,available"),
get("menu_promotions?select=id,name,description,image_url,price,active&active=eq.true")]);
const next=[];
const day=controls.find(x=>x.burger_of_day===true&&x.available!==false&&x.day_price!=null&&/^0-\d+$/.test(x.product_id));
if(day)next.push({name:day.product_name,description:ingredientsFor(day.product_id,day.description),image:imageFor(day.product_id,day.image_url),price:day.day_price,regularPrice:day.price,isDay:true,tag:"🔥 BURGER DEL DÍA"});
next.push(...controls.filter(x=>x.available!==false&&/^[01]-\d+$/.test(x.product_id)&&x.price!=null&&(!day||x.product_id!==day.product_id)).map(x=>({name:x.product_name,description:ingredientsFor(x.product_id,x.description),image:imageFor(x.product_id,x.image_url),price:x.price,tag:"🍔 SMASH BURGERS"})));
next.push(...custom.filter(x=>x.available!==false&&x.category==="Hamburguesas").map(x=>({name:x.name,description:x.description,image:imageFor(null,x.image_url),price:x.price,tag:"🍔 NUESTRAS BURGERS"})));
next.push(...promos.map(x=>({name:x.name,description:x.description,image:imageFor(null,x.image_url),price:x.price,tag:"🔥 PROMOCIONES"})));
slides=next.filter(x=>x.name&&Number.isFinite(Number(x.price))&&Number(x.price)>=0);if(current>=slides.length)current=0;show()
}catch(e){console.warn("La TV conservará el último menú cargado",e)}}
async function refreshReady(){try{const r=await fetch(BASE+"/rest/v1/rpc/tv_ready_orders",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:"{}",cache:"no-store"});if(!r.ok)throw Error("Sin acceso a pedidos");const rows=await r.json();const target=$("ready");target.replaceChildren();if(!rows.length){const el=document.createElement("span");el.className="empty";el.textContent="Esperando pedidos listos…";target.append(el)}else rows.slice(0,7).forEach(o=>{const el=document.createElement("span");el.className="number";el.textContent="#"+o.order_number;target.append(el)})}catch(e){console.warn("No se pudo actualizar pedidos listos",e)}}
refreshMenu();refreshReady();setInterval(()=>{current++;show()},9000);setInterval(refreshMenu,60000);setInterval(refreshReady,6000);
</script></body></html>
