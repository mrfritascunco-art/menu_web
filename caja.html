<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Fritas | Caja</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#111;font:16px Arial,sans-serif}header{background:#111;color:#ffc400;text-align:center;padding:20px;border-bottom:5px solid #ffc400;font-weight:900;font-size:23px}main{max-width:850px;margin:auto;padding:16px}.panel{background:white;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #0001}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc}input,select{width:100%;margin:7px 0}button{background:#ffc400;border:0;font-weight:800;cursor:pointer}.wide{width:100%;margin:8px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.item{border:1px solid #ddd;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:8px}.item button{margin-top:auto}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:10px 0}.line button{padding:7px 12px}.total{font-size:27px;font-weight:900;text-align:right}.muted{color:#666;font-size:13px}.error{color:#a21b1b}h2{margin:5px 0 15px}</style></head><body><header>🍟 MR. FRITAS · CAJA</header><main><section id="login" class="panel"><h2>🔐 Ingreso personal</h2><input id="email" type="email" placeholder="Correo de caja" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="signIn" class="wide">Ingresar</button><p id="loginMessage" class="muted"></p></section><div id="app" class="hidden"><section class="panel"><h2>🧾 Nueva venta directa</h2><input id="search" placeholder="Buscar producto…"><div id="catalog" class="grid"></div></section><section id="customPanel" class="panel hidden"><h2 id="customTitle">Personalizar producto</h2><div id="extrasList"></div><button id="confirmCustom" class="wide">Agregar a la venta</button><button id="cancelCustom" class="wide" style="background:#ddd">Cancelar</button></section><section class="panel"><h2>🛒 Venta actual</h2><div id="basket"><p class="muted">Selecciona un producto para comenzar.</p></div><p class="total" id="total">$0</p><label>Medio de pago<select id="payment"><option>Efectivo</option><option>Débito</option><option>Crédito</option><option>Transferencia</option></select></label><button id="save" class="wide">✅ Registrar venta</button><p id="message" class="muted"></p></section><section class="panel"><button id="logout" class="wide" style="background:#111;color:white">Cerrar sesión</button></section></div></main><script>
const BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
const sections=[
{name:"Smash Burgers",items:[
["Smash Peanut",8990,"Carne smash, queso cheddar, tocino, mantequilla de maní • Incluye papitas","peanut.jpg"],
["Cheese Burger",4990,"Carne smash, pepinillos, mayo casera","cheese_burger.jpg"],
["Smash Bacon",9500,"Carne smash, cheddar, tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","bacon.jpg"],
["Smash Champi",7500,"Carne smash, champiñones, cebolla caramelizada, queso mantecoso, mayo casera • Incluye papitas","champi.png"],
["Smash Italiana",7500,"Carne smash, tomate, palta, mayo casera • Incluye papitas","italiana.jpg"],
["Smash Fresh",7500,"Carne smash, lechuga, cebolla morada, queso cheddar, mayo casera • Incluye papitas","fresh.jpg"],
["Mr ¼ de Kilo",13500,"3 carnes smash (255 g), triple cheddar, doble tocino crispy, cebolla caramelizada, salsa BBQ, mayo casera • Incluye papitas","cuarto_de_kilo.png"],
["Oklahoma Burger",7490,"Carne smash estilo Oklahoma con cebolla, pepinillo, queso mantecoso, mostaza • Incluye papitas","oklahoma.png"],
["Cuarto de Libra",5990,"Carne smash (120 g), doble cheddar, cebolla, ketchup, mostaza, pepinillo","cuarto_de_libra.png"],
["Smash Whopper",5990,"Carne smash, lechuga, cebolla, tomate, mayo casera","whopper.png"],
["Smash Clásica",6900,"Carne smash, queso cheddar, cebolla morada, pepinillos, mayonesa • Incluye papitas","clasica.jpg"],
["Smash Doble",8900,"Doble carne smash, doble queso cheddar, cebolla morada, pepinillos, mayo casera","Hamburguesa doble con queso y pepinillos.png"]]},
{name:"Arma tu Smash",items:[["Base Smash",5500,"Pan brioche, carne smash y mayo casera • Incluye papas fritas","Arma tu burger graffiti.png"]]},
{name:"Papas & Toppings",items:[["Arma tus Papas Base",3000,"Papas fritas naturales • tamaño base • Toppings sujetos a disponibilidad del día"],["Arma tus Papas Grande",5000,"Papas fritas naturales • tamaño grande • Toppings sujetos a disponibilidad del día"]]},
{name:"Snacks",items:[
["6 Empanadas de queso",2500,"6 empanadas de queso tipo cocktail","empanadas.jpg.png"],
["4 Nuggets de pollo",2500,"4 nuggets de pollo","nuggets.jpg.png"],
["4 Aros de cebolla",2500,"4 aros de cebolla","aros de cebolla.jpg.png"]]},
{name:"Bebidas",items:[
["Bebida en lata",2000,"Coca-Cola, Sprite, Fanta, Kem, Canada Dry o Limón Soda • Variedades sujetas a disponibilidad del día","Refrescante surtido de sodas con hielo.png"]]},
{name:"Promos",items:[["Combo para 2",17900,"2 smash clásicas + papas + salsas + 2 bebidas • Exclusivo consumo local","Combo de Hamburguesas y Papas.png"]]}
];
let burgerExtras=[["Carne smash extra",2000],["Tocino crispy",1500],["Queso cheddar",1000],["Queso mantecoso",1000],["Champiñones",1000],["Cebolla caramelizada",800],["Cebolla morada",800],["Pepinillos",800],["Lechuga",800],["Tomate",800],["Palta",1500],["Cebolla",800],["Mayo casera",500],["Salsa BBQ",500],["Mostaza",0],["Ketchup",0]];
let freeSauces=["Ketchup","Mostaza","BBQ","Ají"];
let friesToppings=[["Carne mechada",2000],["Pollo",2000],["Tocino crispy",2500],["Salchichas",1500],["Queso fundido",1500],["Queso cheddar",1500],["Cebolla caramelizada",1000],["Pimentón",1000],["Champiñón",1000],["Choclo",1000],["Salsa premium",500]];

const $=id=>document.getElementById(id),money=n=>"$"+Number(n||0).toLocaleString("es-CL");let token="",cart={},products=[],saving=false,selectedProduct=null,selectedExtras=[];
async function api(path,options={}){const headers={apikey:KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})};const res=await fetch(BASE+path,{...options,headers});if(!res.ok)throw Error((await res.text()).slice(0,400));if(res.status===204||res.status===205)return null;const body=await res.text();return body?JSON.parse(body):null}
function catalog(){const q=$("search").value.toLowerCase();$("catalog").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>'<div class="item"><strong>'+escapeHtml(p.name)+'</strong><span>'+money(p.price)+'</span><button data-add="'+p.id+'">+ Agregar</button></div>').join("")||'<p>No se encontraron productos.</p>'}
function extraOptions(p){const group=Number(p.id.split("-")[0]);return group===0||group===1?burgerExtras:group===2?friesToppings:[]}
function startCustom(id){const p=products.find(x=>x.id===id);if(!p)return;const options=extraOptions(p);if(Number(p.id.split("-")[0])===2){for(const name of ["Carne mechada","Pollo"]){let x=options.find(e=>e[0]===name);if(!x){x=[name,2000,true];options.unshift(x)}x[2]=true}}if(!options.length){addToCart(id,[]);return}selectedProduct=p;selectedExtras=[];$("customTitle").textContent="Personalizar: "+p.name;$("extrasList").innerHTML=options.filter(x=>x[2]!==false).map((x,i)=>'<label class="line"><span>'+escapeHtml(x[0])+' · +'+money(x[1])+'</span><input style="width:24px" type="checkbox" data-extra="'+encodeURIComponent(x[0])+'"></label>').join("");$("customPanel").classList.remove("hidden");$("customPanel").scrollIntoView({behavior:"smooth",block:"start"})}
function addToCart(id,extras){const p=products.find(x=>x.id===id);if(!p)return;const options=extraOptions(p);if(Number(p.id.split("-")[0])===2)for(const name of ["Carne mechada","Pollo"]){let x=options.find(e=>e[0]===name);if(!x){x=[name,2000,true];options.unshift(x)}x[2]=true}const chosen=extras.map(name=>options.find(x=>x[0]===name&&x[2]!==false)).filter(Boolean).map(x=>({name:x[0],price:Number(x[1])}));const key=id+"|"+chosen.map(x=>x.name).sort().join("|");if(!cart[key])cart[key]={id,quantity:0,extras:chosen};cart[key].quantity++;basket()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function basket(){let sum=0;$("basket").innerHTML=Object.entries(cart).map(([key,line])=>{const p=products.find(x=>x.id===line.id);if(!p)return "";const unit=p.price+line.extras.reduce((a,x)=>a+x.price,0);sum+=unit*line.quantity;return '<div class="line"><span>'+escapeHtml(p.name)+'<br><small>'+line.quantity+' × '+money(unit)+(line.extras.length?'<br>+ '+line.extras.map(x=>escapeHtml(x.name)).join(", "):"")+'</small></span><span><button data-minus="'+encodeURIComponent(key)+'">−</button> <button data-plus="'+encodeURIComponent(key)+'">+</button></span></div>'}).join("")||'<p class="muted">Selecciona un producto para comenzar.</p>';$("total").textContent=money(sum);return sum}
async function loadCatalog(){if(!token)return;try{const controls=await api("/rest/v1/menu_control?select=product_id,available,price");let promotions=[];try{const response=await fetch(BASE+"/rest/v1/menu_promotions?select=id,name,price,kitchen_details&active=eq.true&order=sort_order.asc,id.asc",{headers:{apikey:KEY},cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);promotions=await response.json()}catch(err){console.warn("No se pudieron cargar combos",err);$("message").textContent="⚠️ No se pudieron cargar los combos nuevos; revisa la conexión."}
const [burgerRows,friesRows,sauceRows]=await Promise.all([
 api("/rest/v1/menu_extras?select=name,price,available"),
 api("/rest/v1/menu_papas_extras?select=name,price,available"),
 api("/rest/v1/menu_sauces?select=name,available")
]);
const burgerBy=Object.fromEntries(burgerRows.map(x=>[x.name,x])),friesBy=Object.fromEntries(friesRows.map(x=>[x.name,x])),sauceBy=Object.fromEntries(sauceRows.map(x=>[x.name,x]));
burgerExtras=burgerExtras.map(x=>{const row=burgerBy[x[0]];return row?[x[0],Number(row.price),row.available]:x}).map(x=>sauceBy[x[0]]?[x[0],x[1],sauceBy[x[0]].available]:x);
friesToppings=friesToppings.map(x=>{const row=friesBy[x[0]];return row?[x[0],Number(row.price),row.available]:x});const by=Object.fromEntries(controls.map(x=>[x.product_id,x]));products=sections.flatMap((sec,i)=>sec.items.map((p,j)=>{const id=i+"-"+j,c=by[id];return {id,name:p[0],price:c?.price==null?Number(p[1]):Number(c.price),available:c?.available!==false}})).filter(x=>x.available&&x.price>=0);products.push(...promotions.filter(p=>p.name&&Number.isFinite(Number(p.price))&&Number(p.price)>=0).map(p=>({id:"promo-"+p.id,name:p.name,price:Number(p.price),available:true,kitchen_details:p.kitchen_details||""})));for(const [key,line] of Object.entries(cart)){const p=products.find(p=>p.id===line.id);if(!p){delete cart[key];continue}const options=extraOptions(p);if(Number(p.id.split("-")[0])===2)for(const name of ["Carne mechada","Pollo"]){let x=options.find(e=>e[0]===name);if(!x){x=[name,2000,true];options.unshift(x)}x[2]=true}if(line.extras.some(x=>!options.some(y=>y[0]===x.name&&y[2]!==false)))delete cart[key];else line.extras=line.extras.map(x=>{const e=options.find(y=>y[0]===x.name);return {name:e[0],price:Number(e[1])}})}catalog();basket()}catch(e){$("message").textContent="⚠️ No se pudo sincronizar el menú. Verifica la conexión antes de cobrar."}}
async function signIn(){try{$("loginMessage").textContent="Ingresando…";const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});token=r.access_token;const role=await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"caja"})});const admin=role===true?true:await api("/rest/v1/rpc/has_staff_role",{method:"POST",body:JSON.stringify({p_role:"admin"})});if(admin!==true){token="";throw Error("Esta cuenta no tiene permiso de caja.")}sessionStorage.setItem("mf_cash_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadCatalog()}catch(e){$("loginMessage").textContent="No se pudo ingresar: "+e.message}}
async function save(){if(saving)return;await loadCatalog();const entries=Object.values(cart);if(!entries.length)return alert("Agrega al menos un producto.");const items=entries.map(line=>{const p=products.find(x=>x.id===line.id);return {product_id:line.id,name:p.name,quantity:line.quantity,price:p.price+line.extras.reduce((a,x)=>a+x.price,0),extras:line.extras,...(p.kitchen_details?{kitchen_details:p.kitchen_details}: {})}}),total=items.reduce((s,x)=>s+x.price*x.quantity,0);if(!confirm("¿Registrar venta por "+money(total)+"?"))return;saving=true;$("save").disabled=true;$("message").textContent="Guardando…";try{await api("/rest/v1/direct_sales",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({items,payment_method:$("payment").value,total})});cart={};basket();$("message").textContent="✅ Venta registrada correctamente";}catch(e){$("message").textContent="❌ No se guardó la venta: "+e.message}finally{saving=false;$("save").disabled=false}}
setInterval(loadCatalog,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadCatalog()});$("signIn").onclick=signIn;$("search").oninput=catalog;$("save").onclick=save;$("logout").onclick=()=>{sessionStorage.removeItem("mf_cash_token");token="";location.reload()};$("confirmCustom").onclick=()=>{if(!selectedProduct)return;const extras=Array.from($("extrasList").querySelectorAll("input:checked")).map(x=>decodeURIComponent(x.dataset.extra));addToCart(selectedProduct.id,extras);selectedProduct=null;$("customPanel").classList.add("hidden")};$("cancelCustom").onclick=()=>{$("customPanel").classList.add("hidden");selectedProduct=null};
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]"),m=e.target.closest("[data-minus]"),plus=e.target.closest("[data-plus]");if(a)startCustom(a.dataset.add);if(m){const key=decodeURIComponent(m.dataset.minus);if(cart[key]){cart[key].quantity--;if(cart[key].quantity<=0)delete cart[key];basket()}}if(plus){const key=decodeURIComponent(plus.dataset.plus);if(cart[key]){cart[key].quantity++;basket()}}});
</script></body></html>
