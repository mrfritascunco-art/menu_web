<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr Fritas · Pedidos tótem en caja</title>
<style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;margin:0;background:#f2f1ed;color:#111}header{background:#111;color:#ffc400;padding:20px;text-align:center;font-weight:900;font-size:22px}main{max-width:850px;margin:20px auto;padding:0 16px}.panel{background:white;padding:20px;border-radius:16px;margin-bottom:14px;box-shadow:0 4px 16px #0001}input,button{font:inherit;padding:13px;border-radius:10px}input{display:block;width:100%;margin:10px 0;border:1px solid #bbb}button{border:0;background:#ffc400;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wide{width:100%}.hidden{display:none}.order{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#666;font-size:14px}.total{font-size:24px;font-weight:900}a{color:inherit}</style></head>
<body><header>🍟 MR FRITAS · PEDIDOS DEL TÓTEM</header><main>
<section class="panel" id="login"><h2>🔐 Acceso Caja</h2><input id="email" type="email" placeholder="Correo de Caja"><input id="password" type="password" placeholder="Contraseña"><button id="signIn" class="wide">Ingresar</button><p id="loginMessage" class="muted"></p></section>
<div id="app" class="hidden"><section class="panel"><div class="row"><h2>🧾 Pendientes de pago</h2><button id="refresh">Actualizar</button></div><p class="muted">Confirma solo cuando hayas cobrado o verificado la transferencia. El pedido no se envía a Cocina desde esta pantalla todavía.</p><div id="orders">Cargando…</div><p id="message" class="muted"></p></section><section class="panel"><a href="caja.html">← Volver a ventas directas</a> · <button id="logout">Cerrar sesión</button></section></div>
</main><script src="gestion-sesion.js"></script><script>
const BASE="https://oiybkvtamrhjfcyfayes.supabase.co",KEY="sb_publishable_mGfgsfOujYYOBE0y6YZJ0g_jvAjdWVT";
const $=id=>document.getElementById(id),money=n=>"$"+Number(n||0).toLocaleString("es-CL");let token="",busy=false;
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,options={}){const r=await fetch(BASE+path,{...options,headers:{apikey:KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})},cache:"no-store"});if(!r.ok)throw Error((await r.text()).slice(0,250));const t=await r.text();return t?JSON.parse(t):null}
async function load(){if(!token||busy)return;try{const rows=await api("/rest/v1/totem_orders?select=id,order_number,items,total,payment_method,created_at&status=eq.pendiente_pago&order=created_at.asc");$("orders").innerHTML=rows.length?rows.map(o=>{const lines=Array.isArray(o.items)?o.items:[];return '<article class="order"><div class="row"><strong>Pedido #'+safe(o.order_number)+'</strong><span>'+safe(o.payment_method==="transferencia"?"Transferencia":"Pago en caja")+'</span></div><p>'+lines.map(x=>safe((x.quantity||1)+" × "+(x.name||"Producto"))).join("<br>")+'</p><div class="row"><span class="total">'+money(o.total)+'</span><button data-confirm="'+safe(o.id)+'">Confirmar pago</button></div></article>'}).join(""):'<p class="muted">No hay pedidos pendientes.</p>';$("message").textContent=""}catch(e){$("message").textContent="❌ No se pudieron cargar los pedidos: "+e.message}}
async function confirmPayment(id){if(busy||!confirm("¿Ya recibiste y verificaste el pago? Esta acción marcará el pedido como pagado."))return;busy=true;$("message").textContent="Confirmando pago…";try{await api("/rest/v1/rpc/confirm_totem_payment",{method:"POST",body:JSON.stringify({p_order_id:id})});$("message").textContent="✅ Pago confirmado. Pendiente de conexión con Cocina."}catch(e){$("message").textContent="❌ "+e.message}finally{busy=false;await load()}}
async function show(){if(!await MFSession.allowed(token,"caja"))throw Error("Cuenta sin permiso de Caja");$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}
async function signIn(){try{$("loginMessage").textContent="Ingresando…";const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});token=r.access_token;await show()}catch(e){token="";$("loginMessage").textContent="No se pudo ingresar: "+e.message}}
$("signIn").onclick=signIn;$("refresh").onclick=load;$("orders").onclick=e=>{const b=e.target.closest("[data-confirm]");if(b)confirmPayment(b.dataset.confirm)};$("logout").onclick=()=>{MFSession.clear();token="";location.reload()};
setInterval(()=>{if(token)load()},7000);
(async()=>{try{token=await MFSession.get("caja")||"";if(token)await show()}catch(e){token="";$("login").classList.remove("hidden");$("app").classList.add("hidden")}})();
MFSession.watch("caja",()=>token,()=>{token="";$("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginMessage").textContent="Sesión finalizada."});
</script></body></html>
